<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 — Look again. | 2rasi</title>
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#dbeaf0" />
  <link rel="icon" href="assets/logo-2.svg" type="image/svg+xml" />
  <style>
    :root {
      --ink: #071b2e;
      --soft: rgba(7, 27, 46, .62);
      --line: rgba(7, 27, 46, .12);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        linear-gradient(180deg, transparent 0 48.8%, rgba(255,255,255,.34) 49.05%, rgba(47,99,116,.11) 49.35%, transparent 50.15%),
        radial-gradient(ellipse at 50% 38%, rgba(255,255,255,.98) 0%, rgba(241,249,251,.88) 23%, rgba(216,234,239,.36) 47%, rgba(216,234,239,0) 69%),
        linear-gradient(180deg, #deedf2 0%, #d9e9ee 45%, #afc8d0 51%, #92aeb9 68%, #7899a6 100%);
    }
    header {
      position: fixed;
      inset: 0 0 auto 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 26px clamp(24px, 4vw, 64px);
      border-bottom: 1px solid var(--line);
    }
    .brand {
      color: var(--ink);
      text-decoration: none;
      font-weight: 800;
      font-size: 1.25rem;
    }
    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 120px 28px 60px;
      text-align: center;
    }
    .wrap { max-width: 720px; }
    .code {
      margin: 0 0 18px;
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .34em;
    }
    h1 {
      margin: 0;
      font-size: clamp(4rem, 11vw, 9rem);
      font-weight: 520;
      letter-spacing: -.065em;
      line-height: .88;
    }
    p {
      margin: 28px auto 0;
      max-width: 520px;
      color: var(--soft);
      font-size: clamp(1rem, 1.8vw, 1.2rem);
      line-height: 1.55;
    }
    .actions {
      margin-top: 36px;
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }
    .actions a {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding: 0 18px;
      border: 1px solid rgba(7,27,46,.24);
      border-radius: 999px;
      color: var(--ink);
      text-decoration: none;
      font-size: .9rem;
      transition: background .2s ease, border-color .2s ease;
    }
    .actions a:hover {
      background: rgba(255,255,255,.34);
      border-color: rgba(7,27,46,.42);
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/">2rasi</a>
  </header>
  <main>
    <div class="wrap">
      <p class="code">404 · NOT FOUND</p>
      <h1>Look again.</h1>
      <p>This view doesn’t exist. The experiment might.</p>
      <div class="actions">
        <a href="/">Back home</a>
        <a href="/#experiments">Explore experiments</a>
      </div>
    </div>
  </main>
</body>
</html>
