name: Patch PrioLens cohort rule docs v01

on:
  push:
    branches: [feature/priolens-architecture]
    paths:
      - .github/workflows/patch-priolens-cohort-rule-docs-v01.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/priolens-architecture
      - name: Patch source of truth
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          def rep(s,a,b,label):
              if a not in s: raise SystemExit('missing '+label)
              return s.replace(a,b,1)

          p=Path('tools/priolens/RESUME_HERE.md'); s=p.read_text()
          s=rep(s,
          '3. read `docs/OPEN14_CARE_ANALYSIS_RULE_v0.1.md` for the frozen CARE boundary;\n4. read `docs/OPEN14_BILINGUAL_RUNTIME_v0.1.md` as the latest runtime checkpoint;',
          '3. read `docs/OPEN14_PILOT_COHORT_RULE_v0.1.md` for analysis inclusion/exclusion;\n4. read `docs/OPEN14_CARE_ANALYSIS_RULE_v0.1.md` for the frozen CARE boundary;\n5. read `docs/OPEN14_BILINGUAL_RUNTIME_v0.1.md` as the latest runtime checkpoint;',
          'resume read order')
          s=s.replace('5. read `docs/OPEN14_PARTICIPANT_COMPLETION_v0.1.md`;\n6. read `docs/OPEN14_MOBILE_ACCESSIBILITY_HARDENING_v0.1.md`;\n7. read `docs/OPEN14_FINAL_ASSET_BANK_v0.1.md` for the finalized active stimulus bank;\n8. read older docs / File Library only when needed.',
                      '6. read `docs/OPEN14_PARTICIPANT_COMPLETION_v0.1.md`;\n7. read `docs/OPEN14_MOBILE_ACCESSIBILITY_HARDENING_v0.1.md`;\n8. read `docs/OPEN14_FINAL_ASSET_BANK_v0.1.md` for the finalized active stimulus bank;\n9. read older docs / File Library only when needed.',1)
          marker='\n## Live routes\n'
          insert='''\n## Pilot cohort boundary\n\nCanonical inclusion/exclusion rule:\n`docs/OPEN14_PILOT_COHORT_RULE_v0.1.md`\n\nExisting owner, household and technical rows do not need destructive deletion to preserve analysis validity. The first external cohort requires an explicit `PILOT_OPENED_AT_UTC`; only completed rows at/after that cutoff can enter the cohort, and `SYSTEM_SMOKE_DO_NOT_ANALYZE` is always excluded. Keep `language` as an analysis factor.\n'''
          if marker not in s: raise SystemExit('missing resume live marker')
          s=s.replace(marker,insert+marker,1)
          s=s.replace('4. clean or explicitly exclude owner / household / system test rows before pilot analysis;\n','',1)
          p.write_text(s)

          p=Path('tools/priolens/PROJECT_STATE.md'); s=p.read_text()
          s=rep(s,
          '1. `RESUME_HERE.md`\n2. `docs/OPEN14_CARE_ANALYSIS_RULE_v0.1.md`',
          '1. `RESUME_HERE.md`\n2. `docs/OPEN14_PILOT_COHORT_RULE_v0.1.md`\n3. `docs/OPEN14_CARE_ANALYSIS_RULE_v0.1.md`',
          'state read order')
          s=s.replace('3. `docs/OPEN14_BILINGUAL_RUNTIME_v0.1.md`\n4. `docs/OPEN14_PARTICIPANT_COMPLETION_v0.1.md`\n5. `docs/OPEN14_MOBILE_ACCESSIBILITY_HARDENING_v0.1.md`\n6. `docs/OPEN14_FINAL_ASSET_BANK_v0.1.md`\n7. this file\n8. older architecture docs only as needed',
                      '4. `docs/OPEN14_BILINGUAL_RUNTIME_v0.1.md`\n5. `docs/OPEN14_PARTICIPANT_COMPLETION_v0.1.md`\n6. `docs/OPEN14_MOBILE_ACCESSIBILITY_HARDENING_v0.1.md`\n7. `docs/OPEN14_FINAL_ASSET_BANK_v0.1.md`\n8. this file\n9. older architecture docs only as needed',1)
          marker='\n## Formative pilot target\n'
          insert='''\n## Pilot cohort inclusion\n\nCanonical rule:\n`docs/OPEN14_PILOT_COHORT_RULE_v0.1.md`\n\nBefore recruitment, record one explicit UTC cutoff as `PILOT_OPENED_AT_UTC`. External analysis includes only complete rows at/after that cutoff with the frozen schema set. `SYSTEM_SMOKE_DO_NOT_ANALYZE` is excluded at all times. Pre-cutoff owner/household/technical rows remain UX/infrastructure evidence only. Physical deletion is optional and not required for methodological separation.\n'''
          if marker not in s: raise SystemExit('missing state formative marker')
          s=s.replace(marker,insert+marker,1)
          s=s.replace('4. clean or explicitly exclude owner / household / system test rows before pilot analysis;\n','',1)
          p.write_text(s)
          PY
      - name: Commit docs
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/priolens/RESUME_HERE.md tools/priolens/PROJECT_STATE.md
          git commit -m 'docs(priolens): freeze pilot cohort boundary rule'
          git push origin HEAD:feature/priolens-architecture
