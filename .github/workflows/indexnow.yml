name: Submit updated URLs to IndexNow

on:
  push:
    branches:
      - hero-webgl
    paths:
      - 'index.html'
      - 'tools/**'
      - 'sitemap*.xml'
      - 'robots.txt'
      - '.github/workflows/indexnow.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for GitHub Pages deployment
        run: sleep 90

      - name: Submit host-specific sitemaps to IndexNow
        env:
          INDEXNOW_KEY: 6f8b2d914e7c43a1b5f0d2c9e8a76134
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request
          import urllib.error
          import xml.etree.ElementTree as ET

          key = os.environ["INDEXNOW_KEY"]
          jobs = [
              ("2rasi.com", "sitemap-com.xml"),
              ("2rasi.lt", "sitemap-lt.xml"),
          ]
          ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}

          for host, sitemap in jobs:
              root = ET.parse(sitemap).getroot()
              urls = [n.text.strip() for n in root.findall("sm:url/sm:loc", ns) if n.text]
              payload = {
                  "host": host,
                  "key": key,
                  "keyLocation": f"https://{host}/{key}.txt",
                  "urlList": urls,
              }
              data = json.dumps(payload).encode("utf-8")
              request = urllib.request.Request(
                  "https://api.indexnow.org/indexnow",
                  data=data,
                  headers={"Content-Type": "application/json; charset=utf-8"},
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      status = response.status
                      print(f"{host}: IndexNow HTTP {status}, submitted {len(urls)} URLs")
                      if status not in (200, 202):
                          raise SystemExit(f"Unexpected IndexNow status for {host}: {status}")
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", "replace")
                  raise SystemExit(f"{host}: IndexNow failed HTTP {exc.code}: {body}")
          PY
