name: One-time sync Mirror language fix
on:
  push:
    branches: [hero-webgl]
    paths: ['.github/workflows/one-time-sync-mirror-language.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hero-webgl
          fetch-depth: 0
      - name: Sync Mirror app and cache version
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://raw.githubusercontent.com/olemoz1977/savirefleksijos-testas/278252acbd402f4f68f0ae598ce30640528bf8ea/app.js' -o tools/mirror/run/app.js
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/mirror/run/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<script src="app.js"></script>','<script src="app.js?v=20260825-hostlang"></script>')
          p.write_text(s,encoding='utf-8')
          m=Path('tools/LEGACY_RUNTIME_SOURCES.md')
          x=m.read_text(encoding='utf-8')
          x=x.replace('85d73189ca56f50e2afccf6eb88036341d026d39','278252acbd402f4f68f0ae598ce30640528bf8ea')
          m.write_text(x,encoding='utf-8')
          PY
      - name: Verify
        shell: bash
        run: |
          grep -q 'lang: initialLanguage()' tools/mirror/run/app.js
          grep -q 'host === "2rasi.com"' tools/mirror/run/app.js
          grep -q 'app.js?v=20260825-hostlang' tools/mirror/run/index.html
          grep -q '278252acbd402f4f68f0ae598ce30640528bf8ea' tools/LEGACY_RUNTIME_SOURCES.md
      - name: Commit
        shell: bash
        run: |
          rm .github/workflows/one-time-sync-mirror-language.yml
          git config user.name 'olemoz1977'
          git config user.email 'olemoz1977@gmail.com'
          git add tools/mirror/run/app.js tools/mirror/run/index.html tools/LEGACY_RUNTIME_SOURCES.md .github/workflows/one-time-sync-mirror-language.yml
          git diff --cached --check
          git commit -m 'fix(i18n): start Mirror in host language'
          git push origin HEAD:hero-webgl
