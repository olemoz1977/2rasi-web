name: Deploy WorkStyle pilot Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/workstyle-pilot
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKSTYLE_D1_DATABASE_ID: ${{ secrets.WORKSTYLE_D1_DATABASE_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$WORKSTYLE_D1_DATABASE_ID" || { echo "Missing WORKSTYLE_D1_DATABASE_ID"; exit 1; }

      - name: Build ephemeral Wrangler config
        shell: bash
        run: |
          set -euo pipefail
          cat > wrangler.jsonc <<EOF
          {
            "name": "workstyle-pilot-intake",
            "main": "src/index.js",
            "compatibility_date": "2026-08-23",
            "d1_databases": [
              {
                "binding": "DB",
                "database_name": "workstyle-pilot",
                "database_id": "$WORKSTYLE_D1_DATABASE_ID"
              }
            ]
          }
          EOF

      - name: Validate Worker config
        run: npx --yes wrangler@latest check --config wrangler.jsonc

      - name: Apply D1 schema
        run: npx --yes wrangler@latest d1 execute workstyle-pilot --remote --config wrangler.jsonc --file schema.sql

      - name: Deploy Worker
        run: npx --yes wrangler@latest deploy --config wrangler.jsonc
