name: Deploy WorkStyle pilot Worker

on:
  workflow_dispatch:
    inputs:
      activate_frontend:
        description: Activate the verified Worker endpoint in the LT cognitive pilot
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/workstyle-pilot
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify deployment context
        env:
          RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "hero-webgl" || { echo "Run this workflow from hero-webgl."; exit 1; }
          test -n "$RAW_CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN repository secret."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID repository variable."; exit 1; }

      - name: Normalize and preflight Cloudflare token
        env:
          RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          import re
          from pathlib import Path

          raw = os.environ.get('RAW_CLOUDFLARE_API_TOKEN', '')
          token = raw.strip()

          if token.lower().startswith('bearer '):
              token = token[7:].strip()

          if len(token) >= 2 and token[0] == token[-1] and token[0] in {'"', "'"}:
              token = token[1:-1].strip()

          if not token:
              raise SystemExit('Cloudflare token is empty after normalization.')
          if any(ch.isspace() for ch in token):
              raise SystemExit('Cloudflare token still contains whitespace. GitHub secret must contain only the token value.')
          if not re.fullmatch(r'[A-Za-z0-9_-]{20,}', token):
              raise SystemExit('Cloudflare token format looks invalid. Store only the token value, without Bearer, quotes or labels.')

          github_env = Path(os.environ['GITHUB_ENV'])
          with github_env.open('a', encoding='utf-8') as fh:
              fh.write(f'CLOUDFLARE_API_TOKEN={token}\n')

          if token.startswith('cfat_'):
              print('Cloudflare credential type: account API token.')
          elif token.startswith('cfut_'):
              print('Cloudflare credential type: user API token.')
          else:
              print('Cloudflare credential type: legacy/unprefixed API token.')
          PY

          echo "::add-mask::$CLOUDFLARE_API_TOKEN"

          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database?per_page=1" \
            | jq -e '.success == true' >/dev/null

          echo "Cloudflare API authentication and D1 access: verified."

      - name: Find or create D1 database
        id: d1
        shell: bash
        run: |
          set -euo pipefail
          list_databases() {
            npx --yes wrangler@latest d1 list --json
          }
          find_id() {
            jq -r '
              (if type == "array" then . else (.result // []) end)
              | .[]
              | select(.name == "workstyle-pilot")
              | (.uuid // .id // .database_id // empty)
            ' | head -n 1
          }

          DB_LIST="$(list_databases)"
          DB_ID="$(printf '%s' "$DB_LIST" | find_id)"

          if [ -z "$DB_ID" ]; then
            echo "Creating D1 database workstyle-pilot..."
            npx --yes wrangler@latest d1 create workstyle-pilot
            DB_LIST="$(list_databases)"
            DB_ID="$(printf '%s' "$DB_LIST" | find_id)"
          fi

          test -n "$DB_ID" || { echo "Could not resolve workstyle-pilot D1 database ID."; exit 1; }
          echo "WORKSTYLE_D1_DATABASE_ID=$DB_ID" >> "$GITHUB_ENV"
          echo "database_id=$DB_ID" >> "$GITHUB_OUTPUT"
          echo "Using D1 database: $DB_ID"

      - name: Build ephemeral Wrangler config
        shell: bash
        run: |
          set -euo pipefail
          cat > wrangler.jsonc <<EOF
          {
            "name": "workstyle-pilot-intake",
            "main": "src/index.js",
            "compatibility_date": "2026-08-23",
            "workers_dev": true,
            "d1_databases": [
              {
                "binding": "DB",
                "database_name": "workstyle-pilot",
                "database_id": "$WORKSTYLE_D1_DATABASE_ID"
              }
            ]
          }
          EOF

      - name: Validate Worker bundle
        run: npx --yes wrangler@latest deploy --dry-run --config wrangler.jsonc

      - name: Apply D1 schema
        run: npx --yes wrangler@latest d1 execute workstyle-pilot --remote --config wrangler.jsonc --file schema.sql --yes

      - name: Deploy Worker
        id: worker
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest deploy --config wrangler.jsonc 2>&1 | tee deploy.log
          WORKER_URL="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' deploy.log | tail -n 1)"
          test -n "$WORKER_URL" || { echo "Could not detect workers.dev URL from Wrangler output."; exit 1; }
          echo "WORKER_URL=$WORKER_URL" >> "$GITHUB_ENV"
          echo "worker_url=$WORKER_URL" >> "$GITHUB_OUTPUT"
          echo "Worker URL: $WORKER_URL"

      - name: Verify health and browser CORS
        shell: bash
        run: |
          set -euo pipefail
          HEALTH="$(curl --fail --silent --show-error "$WORKER_URL/health")"
          printf '%s' "$HEALTH" | jq -e '.ok == true and .service == "workstyle-pilot-intake"' >/dev/null

          for ORIGIN in https://2rasi.lt https://2rasi.com; do
            HEADERS="$(curl --silent --show-error --dump-header - --output /dev/null \
              --request OPTIONS \
              --header "Origin: $ORIGIN" \
              --header 'Access-Control-Request-Method: POST' \
              "$WORKER_URL/v1/session")"
            printf '%s' "$HEADERS" | grep -qi "^access-control-allow-origin: $ORIGIN"
          done

      - name: Verify synthetic POST and D1 insert
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail --silent --show-error \
            --request POST \
            --header 'Origin: https://2rasi.lt' \
            --header 'Content-Type: application/json' \
            --data-binary @test-session-v3.json \
            "$WORKER_URL/v1/session")"
          printf '%s' "$RESPONSE" | jq -e '.ok == true and .sessionId == "synthetic-workstyle-v07-test"' >/dev/null

          npx --yes wrangler@latest d1 execute workstyle-pilot \
            --remote \
            --config wrangler.jsonc \
            --command "SELECT session_id FROM workstyle_sessions WHERE session_id='synthetic-workstyle-v07-test';" \
            --json > d1-check.json
          grep -q 'synthetic-workstyle-v07-test' d1-check.json

          npx --yes wrangler@latest d1 execute workstyle-pilot \
            --remote \
            --config wrangler.jsonc \
            --command "DELETE FROM workstyle_sessions WHERE session_id='synthetic-workstyle-v07-test';" \
            --json >/dev/null

      - name: Activate verified frontend endpoint
        if: ${{ inputs.activate_frontend }}
        shell: bash
        run: |
          set -euo pipefail
          CONFIG="$GITHUB_WORKSPACE/tools/workstyle15/v07-intake-config.js"
          PILOT_HTML="$GITHUB_WORKSPACE/tools/workstyle15/v07-cognitive.html"
          CACHE_KEY="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          cat > "$CONFIG" <<EOF
          window.WORKSTYLE_V07_INTAKE = Object.freeze({
            enabled: true,
            sessionUrl: '$WORKER_URL/v1/session',
            storageKey: 'workstyle-v07-cognitive-session-e',
            expectedResponses: 34,
            requestTimeoutMs: 15000,
            privacyText: 'Jei pasirinksi pateikti piloto duomenis, atsakymai, pažymėti neaiškumai ir aktyvus atsakymo laikas bus perduoti tyrimo analizei. Vardo, el. pašto ar darbdavio neprašome.'
          });
          EOF

          CACHE_KEY="$CACHE_KEY" PILOT_HTML="$PILOT_HTML" python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path(os.environ['PILOT_HTML'])
          text = path.read_text(encoding='utf-8')
          cache_key = os.environ['CACHE_KEY']

          patterns = [
              r'v07-intake-config\.js\?v=[^"\']+',
              r'v07-intake-client\.js\?v=[^"\']+',
          ]
          replacements = [
              f'v07-intake-config.js?v={cache_key}',
              f'v07-intake-client.js?v={cache_key}',
          ]

          for pattern, replacement in zip(patterns, replacements):
              text, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f'Could not update intake asset cache-buster: {pattern}')

          path.write_text(text, encoding='utf-8')
          PY

          git -C "$GITHUB_WORKSPACE" config user.name "github-actions[bot]"
          git -C "$GITHUB_WORKSPACE" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$GITHUB_WORKSPACE" add tools/workstyle15/v07-intake-config.js tools/workstyle15/v07-cognitive.html

          if git -C "$GITHUB_WORKSPACE" diff --cached --quiet; then
            echo "Frontend intake config already points to this endpoint."
          else
            git -C "$GITHUB_WORKSPACE" commit -m "chore(workstyle): activate verified pilot intake"
            git -C "$GITHUB_WORKSPACE" push origin "HEAD:hero-webgl"
          fi

      - name: Deployment summary
        shell: bash
        run: |
          {
            echo "## WorkStyle pilot intake"
            echo
            echo "- Worker: $WORKER_URL"
            echo "- Health: verified"
            echo "- CORS from 2rasi.lt and 2rasi.com: verified"
            echo "- Synthetic POST -> D1: verified"
            echo "- Synthetic row cleanup: done"
            echo "- Frontend activation requested: ${{ inputs.activate_frontend }}"
          } >> "$GITHUB_STEP_SUMMARY"
