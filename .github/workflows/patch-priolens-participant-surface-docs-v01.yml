name: Patch PrioLens participant surface docs v01

on:
  push:
    branches: [feature/priolens-architecture]
    paths:
      - .github/workflows/patch-priolens-participant-surface-docs-v01.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/priolens-architecture
          fetch-depth: 0

      - name: Patch RESUME_HERE
        shell: python
        run: |
          from pathlib import Path
          p=Path('tools/priolens/RESUME_HERE.md')
          s=p.read_text()
          old='''6. read `docs/OPEN14_PREPILOT_SMOKE_FINDINGS_2026-09-02.md` for the latest UX / public-routing checkpoint;\n7. read `docs/OPEN14_PARTICIPANT_COMPLETION_v0.1.md`;\n8. read `docs/OPEN14_MOBILE_ACCESSIBILITY_HARDENING_v0.1.md`;\n9. read `docs/OPEN14_FINAL_ASSET_BANK_v0.1.md` for the finalized active stimulus bank;\n10. read older docs / File Library only when needed.'''
          new='''6. read `docs/OPEN14_PREPILOT_SMOKE_FINDINGS_2026-09-02.md` for the latest UX / public-routing checkpoint;\n7. read `docs/OPEN14_PARTICIPANT_SURFACE_v0.1.md` for the latest participant intro / result presentation rule;\n8. read `docs/OPEN14_PARTICIPANT_COMPLETION_v0.1.md`;\n9. read `docs/OPEN14_MOBILE_ACCESSIBILITY_HARDENING_v0.1.md`;\n10. read `docs/OPEN14_FINAL_ASSET_BANK_v0.1.md` for the finalized active stimulus bank;\n11. read older docs / File Library only when needed.'''
          if old not in s: raise SystemExit('recovery-order anchor not found')
          s=s.replace(old,new,1)

          anchor='''Canonical detailed checkpoint:\n`docs/OPEN14_PREPILOT_SMOKE_FINDINGS_2026-09-02.md`\n\n### CARE boundary frozen'''
          block='''Canonical detailed checkpoint:\n`docs/OPEN14_PREPILOT_SMOKE_FINDINGS_2026-09-02.md`\n\n### Participant surface hardened — 2026-09-02\n\nCanonical participant-surface checkpoint:\n`docs/OPEN14_PARTICIPANT_SURFACE_v0.1.md`\n\nRuntime commit:\n`caa49b0dcb372fc085e79ec15fbd3fce66dd6d12`\n\nDeployment / live-source smoke workflow:\n`33622563632` — SUCCESS.\n\nParticipant-facing changes:\n- `Open14` is now internal-only terminology; normal UI shows `PrioLens` and `Tyrimo prototipas / Research prototype`;\n- successful image-bank readiness checks disappear instead of occupying the intro;\n- the intro is action-oriented and no longer reads like a technical runtime screen;\n- result hierarchy is `Pirmas žvilgsnis / First glance` -> `Antras atsakymas / Second answer` -> `Pažvelk dar kartą / Look again`;\n- normal participant results no longer show `0/2`, `1/2`, `2/2`, decimal domain averages or score bars;\n- incomplete sufficiency domains remain in research data but are not presented as complete participant interpretations;\n- raw diagnostics remain debug-only.\n\nResearch model, schema, CARE boundary and cohort rule are unchanged.\n\n### CARE boundary frozen'''
          if anchor not in s: raise SystemExit('surface-section anchor not found')
          s=s.replace(anchor,block,1)

          old_remaining='''1. re-smoke the live no-value slider and persistent exit, preferably on mobile;\n2. run one fresh full mobile participant smoke in LT, including summary, coverage states, repeat and return;\n3. run one focused EN smoke;\n4. manually re-smoke public `.lt` and `.com` card -> landing -> Open14 -> return, with `.com` specifically proving EN;\n5. configure and smoke the 90-day cleanup cron;\n6. only when recruitment intentionally opens, record `PILOT_OPENED_AT_UTC` before distributing the recruitment link.'''
          new_remaining='''1. smoke the new participant intro and result hierarchy on mobile, including the all-`Sunku pasakyti / Hard to say` edge case;\n2. run one fresh full mobile participant smoke in LT, including result presentation, repeat and return;\n3. run one focused EN smoke through the new result presentation;\n4. manually complete the public `.lt` and `.com` card -> landing -> PrioLens -> return journey;\n5. configure and smoke the 90-day cleanup cron;\n6. only when recruitment intentionally opens, record `PILOT_OPENED_AT_UTC` before distributing the recruitment link.'''
          if old_remaining not in s: raise SystemExit('remaining-work anchor not found')
          s=s.replace(old_remaining,new_remaining,1)
          p.write_text(s)

      - name: Validate docs
        shell: bash
        run: |
          set -euo pipefail
          f='tools/priolens/RESUME_HERE.md'
          grep -q 'OPEN14_PARTICIPANT_SURFACE_v0.1.md' "$f"
          grep -q 'caa49b0dcb372fc085e79ec15fbd3fce66dd6d12' "$f"
          grep -q '33622563632' "$f"
          grep -q 'Open14.*internal-only' "$f"
          grep -q 'all-`Sunku pasakyti / Hard to say` edge case' "$f"

      - name: Commit docs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/priolens/RESUME_HERE.md
          git commit -m 'docs(priolens): index participant surface checkpoint'
          git push origin HEAD:feature/priolens-architecture
