name: Restore PrioLens card copy v01

on:
  push:
    branches: [feature/priolens-architecture]
    paths:
      - .github/workflows/restore-priolens-card-copy-v01.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/priolens-architecture
      - name: Restore approved card copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<p class="portal-hook" data-en="When several things matter, what pulls you first?" data-lt="Kai svarbūs keli dalykai, kas patraukia pirmiausia?">When several things matter, what pulls you first?</p>'
          new='<p class="portal-hook" data-en="A first glance and a second answer do not always show the same thing." data-lt="Pirmas žvilgsnis ir antras atsakymas ne visada rodo tą patį.">A first glance and a second answer do not always show the same thing.</p>'
          if old not in s:
              raise SystemExit('expected PrioLens card hook not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix(priolens): restore approved card 10 copy'
          git push origin HEAD:feature/priolens-architecture
