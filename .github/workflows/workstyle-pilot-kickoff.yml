name: Kick off WorkStyle pilot deploy once

on:
  push:
    branches:
      - hero-webgl
    paths:
      - .github/workflows/workstyle-pilot-kickoff.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch verified WorkStyle pilot deploy
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --header 'Content-Type: application/json' \
            --data '{"ref":"hero-webgl","inputs":{"activate_frontend":"true"}}' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/workstyle-pilot-worker.yml/dispatches"
          echo "WorkStyle pilot deploy dispatched for hero-webgl with frontend activation enabled."
