name: Smoke PrioLens public entry once v02

on:
  push:
    branches: [feature/priolens-architecture]
    paths:
      - .github/workflows/smoke-priolens-public-entry-once-v02.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check public entry with bounded HTTP timeouts
        shell: bash
        run: |
          set -euo pipefail
          get(){ curl -fsSL --connect-timeout 8 --max-time 20 --retry 1 "$1" -o "$2"; }
          get https://2rasi.lt/ /tmp/lt-home.html
          get https://2rasi.com/ /tmp/en-home.html
          get https://2rasi.lt/tools/priolens/ /tmp/lt-land.html
          get https://2rasi.com/tools/priolens/ /tmp/en-land.html
          grep -q 'id="priolens"' /tmp/lt-home.html
          grep -q 'id="priolens"' /tmp/en-home.html
          grep -q 'Pirmas žvilgsnis ir antras atsakymas ne visada rodo tą patį' /tmp/lt-home.html
          grep -q 'PrioLens' /tmp/lt-land.html
          grep -q 'PrioLens' /tmp/en-land.html
          echo PUBLIC_PRIOLENS_ENTRY_HTTP_OK
