name: Patch PrioLens post-bilingual smoke docs v01

on:
  push:
    branches: [feature/priolens-architecture]
    paths:
      - .github/workflows/patch-priolens-post-bilingual-smoke-docs-v01.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/priolens-architecture
      - name: Patch docs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          def rep(s,a,b,label):
              if a not in s: raise SystemExit('missing '+label)
              return s.replace(a,b,1)

          # RESUME
          p=Path('tools/priolens/RESUME_HERE.md'); s=p.read_text()
          s=rep(s,
          '''Homepage hook:\n- EN: `When several things matter, what pulls you first?`\n- LT: `Kai svarbūs keli dalykai, kas patraukia pirmiausia?`''',
          '''Homepage hook (owner-approved):\n- EN: `A first glance and a second answer do not always show the same thing.`\n- LT: `Pirmas žvilgsnis ir antras atsakymas ne visada rodo tą patį.`\n\nFeature-branch restoration commit: `383ef9bf6c20a7f45a15bd4ee86147a02540efa4`.''','resume hook')
          s=rep(s,
          '''The feature-branch entry route is PREPARED, not considered publicly live until intentionally merged / deployed.''',
          '''Public entry state is mixed and must be described precisely:\n- owner mobile browser confirms the PrioLens card is already visible on public `2rasi.lt`;\n- GitHub-hosted CI could not independently reach `2rasi.lt` on 2026-09-02 because TCP/443 timed out;\n- therefore `.com` and the public landing/return route still require a manual browser smoke before recruitment.''','resume public state')
          s=rep(s,
          '''Workflow run:\n`33544864679` — SUCCESS.''',
          '''Workflow run:\n`33544864679` — SUCCESS.\n\nEN persistence lifecycle smoke:\n`33613108832` — SUCCESS (`partial -> final -> stale partial blocked`) using `language: "en"` and `SYSTEM_SMOKE_DO_NOT_ANALYZE`.''','resume bilingual smoke')
          s=rep(s,
          '''5. intentionally merge / deploy the prepared 10th-card PrioLens entry route only when recruitment opens.''',
          '''5. manually smoke the public `.lt` and `.com` entry -> landing -> Open14 -> return journey before recruitment.''','resume remaining')
          p.write_text(s)

          # PROJECT STATE
          p=Path('tools/priolens/PROJECT_STATE.md'); s=p.read_text()
          s=rep(s,
          '''Homepage hook:\n- EN: `When several things matter, what pulls you first?`\n- LT: `Kai svarbūs keli dalykai, kas patraukia pirmiausia?`''',
          '''Homepage hook (owner-approved):\n- EN: `A first glance and a second answer do not always show the same thing.`\n- LT: `Pirmas žvilgsnis ir antras atsakymas ne visada rodo tą patį.`\n\nFeature-branch restoration commit: `383ef9bf6c20a7f45a15bd4ee86147a02540efa4`.''','state hook')
          s=rep(s,
          '''The feature-branch entry route is PREPARED, not considered publicly live until intentionally merged / deployed.''',
          '''Owner mobile-browser evidence confirms the PrioLens card is already public on `2rasi.lt`.\nGitHub-hosted HTTP smoke could not connect to `2rasi.lt` (TCP/443 timeout), so `.com` and the public landing/return path are not independently CI-verified and still need manual browser smoke.''','state public state')
          s=rep(s,
          '''Workflow run:\n`33544864679` — SUCCESS.''',
          '''Workflow run:\n`33544864679` — SUCCESS.\n\nEN persistence lifecycle smoke run:\n`33613108832` — SUCCESS. It verified `language: en` through partial checkpoint, final API submission, and stale-partial protection. The synthetic row uses `SYSTEM_SMOKE_DO_NOT_ANALYZE`.''','state bilingual smoke')
          s=rep(s,
          '''5. intentionally merge / deploy the prepared PrioLens 10th-card route only when recruitment opens.''',
          '''5. manually smoke the public `.lt` and `.com` card -> landing -> Open14 -> return path before recruitment.''','state remaining')
          p.write_text(s)

          # BILINGUAL CHECKPOINT
          p=Path('tools/priolens/docs/OPEN14_BILINGUAL_RUNTIME_v0.1.md'); s=p.read_text()
          s=s.replace('Date: 2026-09-01','Updated: 2026-09-02',1)
          s=rep(s,
          '''Validation passed:\n- inline module JavaScript syntax;\n- PHP syntax for final and progress APIs;\n- live source smoke;\n- API health smoke.''',
          '''Validation passed:\n- inline module JavaScript syntax;\n- PHP syntax for final and progress APIs;\n- live source smoke;\n- API health smoke;\n- EN persistence lifecycle smoke run `33613108832`: partial checkpoint -> final submission -> stale partial blocked.\n\nThe EN synthetic persistence row uses `language: "en"`, seed `SYSTEM_SMOKE_DO_NOT_ANALYZE`, and must never enter pilot analysis.''','bilingual validation')
          s=rep(s,
          '''The 10th homepage card and landing are still prepared on `feature/priolens-architecture`; they are not considered publicly released until intentionally merged / deployed.''',
          '''The owner mobile browser confirms the 10th PrioLens card is already visible on public `2rasi.lt`. Its approved copy is:\n- LT: `Pirmas žvilgsnis ir antras atsakymas ne visada rodo tą patį.`\n- EN: `A first glance and a second answer do not always show the same thing.`\n\nThe feature branch was restored to this copy in commit `383ef9bf6c20a7f45a15bd4ee86147a02540efa4`.\n\nAutomated GitHub-runner smoke could not connect to `2rasi.lt` (TCP/443 timeout), so `.com` and public landing/return reachability remain a manual-browser verification item rather than a claimed CI pass.''','bilingual public state')
          s=rep(s,
          '''5. intentionally merge/deploy the prepared 10th-card PrioLens entry route;\n6. only then open the first small external formative recruitment.''',
          '''5. manually smoke public `.lt` and `.com` card -> landing -> Open14 -> return routing;\n6. only then open the first small external formative recruitment.''','bilingual remaining')
          p.write_text(s)
          PY
      - name: Commit docs
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/priolens/RESUME_HERE.md tools/priolens/PROJECT_STATE.md tools/priolens/docs/OPEN14_BILINGUAL_RUNTIME_v0.1.md
          git commit -m 'docs(priolens): record bilingual lifecycle and entry state'
          git push origin HEAD:feature/priolens-architecture
