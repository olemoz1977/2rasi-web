name: Fix LT hero WebGL words

on:
  push:
    branches:
      - hero-webgl
    paths:
      - .github/workflows/one-time-fix-lt-hero-words.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hero-webgl
          fetch-depth: 0

      - name: Patch hard-coded WebGL pseudo text
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          css = Path('hero.css')
          text = css.read_text(encoding='utf-8')
          marker = "/* LT WebGL semantic words */"
          if marker not in text:
              text += "\n\n/* LT WebGL semantic words */\nhtml[lang=\"lt\"] .perception-stage.webgl-active .base-word::before {\n  content: 'STEBĖK';\n}\n\nhtml[lang=\"lt\"] .perception-stage.webgl-active .notice-word::before {\n  content: 'PASTEBĖK';\n}\n"
          css.write_text(text, encoding='utf-8')

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          html = html.replace('hero.css?v=20260816-1145', 'hero.css?v=20260825-ltwords')
          index.write_text(html, encoding='utf-8')
          PY

      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          grep -q "content: 'STEBĖK'" hero.css
          grep -q "content: 'PASTEBĖK'" hero.css
          grep -q 'hero.css?v=20260825-ltwords' index.html

      - name: Check branch did not move
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin hero-webgl
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/hero-webgl)" || { echo 'Branch moved; aborting'; exit 1; }

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-time-fix-lt-hero-words.yml
          git config user.name 'olemoz1977'
          git config user.email 'olemoz1977@gmail.com'
          git add hero.css index.html .github/workflows/one-time-fix-lt-hero-words.yml
          git diff --cached --check
          git commit -m 'fix(i18n): localize WebGL hero words on LT'
          git push origin HEAD:hero-webgl
