name: One-time trust navigation polish

on:
  push:
    branches:
      - hero-webgl
    paths:
      - .github/workflows/one-time-trust-polish.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hero-webgl
          fetch-depth: 0

      - name: Polish local navigation semantics and cache versions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          text = text.replace('i18n.js?v=20260824-0732', 'i18n.js?v=20260825-trust')
          anchor = "        document.querySelectorAll('[data-en-legacy]').forEach(link => {\n          const key = link.getAttribute('data-en-legacy');\n          if (routes[key]) link.href = routes[key];\n          link.target = '_self';\n          link.removeAttribute('rel');\n        });"
          addition = anchor + "\n\n        document.querySelectorAll('.experiment-actions a[href^=\"/tools/\"]').forEach(link => {\n          link.target = '_self';\n          link.removeAttribute('rel');\n          const arrow = link.querySelector('span');\n          if (arrow && arrow.textContent.trim() === '↗') arrow.textContent = '→';\n        });"
          if "experiment-actions a[href^=\"/tools/\"]" not in text:
              if anchor not in text:
                  raise SystemExit('Homepage route anchor not found')
              text = text.replace(anchor, addition, 1)
          index.write_text(text, encoding='utf-8')

          landing_js = Path('tools/tool-landing-i18n.js')
          js = landing_js.read_text(encoding='utf-8')
          old = '''// Legacy tools live on GitHub Pages. Keep them in the same browsing context
// so Back naturally returns to this 2rasi landing instead of leaving an
// orphaned tab after the reflection is finished.
(() => {
  document.querySelectorAll('a[href*="olemoz1977.github.io/"]').forEach((link) => {
    link.target = '_self';
    link.removeAttribute('rel');
  });
})();'''
          new = '''// Legacy runtimes now live under the same 2rasi domain. Keep local navigation
// in the same browsing context and use an internal arrow rather than the
// external-link symbol. True external systems keep their ↗ marker.
(() => {
  document.querySelectorAll('a[href^="/tools/"]').forEach((link) => {
    link.target = '_self';
    link.removeAttribute('rel');
    if (link.textContent.includes('↗')) link.textContent = link.textContent.replace('↗', '→');
  });
})();'''
          if old not in js:
              raise SystemExit('Legacy navigation block not found')
          js = js.replace(old, new, 1)
          landing_js.write_text(js, encoding='utf-8')

          for path in Path('tools').glob('*/index.html'):
              html = path.read_text(encoding='utf-8')
              html = html.replace('tool-landing-i18n.js?v=20260824-0135', 'tool-landing-i18n.js?v=20260825-trust')
              path.write_text(html, encoding='utf-8')
          PY

      - name: Verify trust navigation
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'i18n.js?v=20260825-trust' index.html
          grep -q 'experiment-actions a\[href\^="/tools/"\]' index.html
          grep -q 'Legacy runtimes now live under the same 2rasi domain' tools/tool-landing-i18n.js
          grep -q 'tool-landing-i18n.js?v=20260825-trust' tools/mirror/index.html

      - name: Ensure branch is still current
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin hero-webgl
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/hero-webgl)" || { echo 'Branch moved; aborting'; exit 1; }

      - name: Commit polish and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-time-trust-polish.yml
          git config user.name 'olemoz1977'
          git config user.email 'olemoz1977@gmail.com'
          git add index.html tools .github/workflows/one-time-trust-polish.yml
          git diff --cached --check -- index.html tools/tool-landing-i18n.js tools/*/index.html
          git commit -m 'fix(trust): align local navigation cues'
          git push origin HEAD:hero-webgl
