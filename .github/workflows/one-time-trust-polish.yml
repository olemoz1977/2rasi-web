name: Trust navigation polish

on:
  push:
    branches:
      - hero-webgl
    paths:
      - .github/workflows/one-time-trust-polish.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hero-webgl
          fetch-depth: 0

      - name: Apply patch
        run: python .github/scripts/one_time_trust_polish.py

      - name: Verify
        run: |
          grep -q 'i18n.js?v=20260825-trust' index.html
          grep -q 'Legacy runtimes now live under the same 2rasi domain' tools/tool-landing-i18n.js
          grep -q 'tool-landing-i18n.js?v=20260825-trust' tools/mirror/index.html

      - name: Check branch
        run: |
          git fetch origin hero-webgl
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/hero-webgl)"

      - name: Commit
        run: |
          rm -f .github/workflows/one-time-trust-polish.yml .github/scripts/one_time_trust_polish.py
          git config user.name olemoz1977
          git config user.email olemoz1977@gmail.com
          git add index.html tools .github/workflows/one-time-trust-polish.yml .github/scripts/one_time_trust_polish.py
          git diff --cached --check -- index.html tools/tool-landing-i18n.js tools/*/index.html
          git commit -m 'fix(trust): align local navigation cues'
          git push origin HEAD:hero-webgl
