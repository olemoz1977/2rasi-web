name: One-time Leadership OMESG route patch

on:
  push:
    branches:
      - integration/leadership-omesg-route
    paths:
      - .github/workflows/patch-leadership-omesg-route.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/leadership-omesg-route
      - name: Patch Leadership routing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          old = 'https://olemoz1977.github.io/gla360-personal-full/'

          home = Path('index.html')
          s = home.read_text(encoding='utf-8')
          if s.count(old) != 1:
              raise SystemExit(f'Expected 1 frozen Leadership URL in index.html, got {s.count(old)}')
          s = s.replace(old, 'https://omesg360.eu/leadership-360/?lang=en', 1)
          home.write_text(s, encoding='utf-8')

          tool = Path('tools/leadership-360/index.html')
          s = tool.read_text(encoding='utf-8')
          if s.count(old) != 2:
              raise SystemExit(f'Expected 2 frozen Leadership URLs in tool page, got {s.count(old)}')
          s = s.replace(old, 'https://omesg360.eu/leadership-360/')
          tool.write_text(s, encoding='utf-8')

          i18n = Path('i18n.js')
          s = i18n.read_text(encoding='utf-8')
          marker = "    set('.manifesto-word', 'LOOK', 'ŽIŪRĖK');"
          block = """    const leadershipStart = document.querySelector('#leadership-360 .experiment-actions a:nth-child(2)');\n    if (leadershipStart) {\n      leadershipStart.href = `https://omesg360.eu/leadership-360/?lang=${lang}`;\n    }\n\n"""
          if block not in s:
              if marker not in s:
                  raise SystemExit('i18n insertion marker not found')
              s = s.replace(marker, block + marker, 1)
          i18n.write_text(s, encoding='utf-8')
          PY

          ! grep -RFn 'https://olemoz1977.github.io/gla360-personal-full/' index.html tools/leadership-360/index.html
          grep -Fq 'https://omesg360.eu/leadership-360/?lang=en' index.html
          test "$(grep -Fo 'https://omesg360.eu/leadership-360/' tools/leadership-360/index.html | wc -l | tr -d ' ')" = '2'
          grep -Fq 'leadershipStart.href = `https://omesg360.eu/leadership-360/?lang=${lang}`' i18n.js

      - name: Commit route integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html i18n.js tools/leadership-360/index.html
          git diff --cached --check
          git commit -m 'Route Leadership 360 through OMESG360'
          git push origin HEAD:integration/leadership-omesg-route
