name: Patch PrioLens public entry on hero-webgl v01

on:
  push:
    branches: [hero-webgl]
    paths:
      - .github/workflows/patch-priolens-public-entry-hero-v01.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hero-webgl
          fetch-depth: 0

      - name: Align PrioLens card with source-of-truth landing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          h=p.read_text()
          old='''<div class="portal-copy"><span class="portal-index">10</span><h3>PrioLens</h3><p class="portal-hook" data-en="The first glance and the second answer do not always point to the same thing." data-lt="Pirmas žvilgsnis ir antras atsakymas ne visada rodo tą patį.">The first glance and the second answer do not always point to the same thing.</p><a class="portal-enter" href="https://omesg360.eu/priolens-open14-v02/" data-en="Enter" data-lt="Įeiti">Enter</a></div>'''
          new='''<div class="portal-copy"><span class="portal-index">10</span><h3>PrioLens</h3><p class="portal-hook" data-en="A first glance and a second answer do not always show the same thing." data-lt="Pirmas žvilgsnis ir antras atsakymas ne visada rodo tą patį.">A first glance and a second answer do not always show the same thing.</p><a class="portal-enter" href="/tools/priolens/" data-en="Enter" data-lt="Įeiti">Enter</a></div>'''
          if old not in h:
              raise SystemExit('expected public PrioLens card source not found')
          h=h.replace(old,new,1)
          p.write_text(h)
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          test -f tools/priolens/index.html
          grep -q 'id="priolens"' index.html
          grep -q 'href="/tools/priolens/"' index.html
          grep -q 'A first glance and a second answer do not always show the same thing.' index.html
          grep -q 'from=${from}&lang=${lang}' tools/priolens/index.html
          grep -q 'from=com&lang=en' tools/priolens/index.html
          echo 'PASS: hero-webgl public PrioLens entry aligned'

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix(priolens): route public card through bilingual landing'
          git push origin HEAD:hero-webgl
