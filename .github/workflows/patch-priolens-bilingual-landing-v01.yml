name: Patch PrioLens bilingual landing v01

on:
  push:
    branches: [feature/priolens-architecture]
    paths:
      - .github/workflows/patch-priolens-bilingual-landing-v01.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/priolens-architecture
      - name: Patch bilingual entry links and copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/priolens/index.html')
          h=p.read_text()
          old='The current Open14 formative pilot is available in Lithuanian. You can still enter from 2rasi.com; the experiment itself will open in Lithuanian.'
          new='Open14 follows the site language: English on 2rasi.com and Lithuanian on 2rasi.lt. After finishing, you can return to 2rasi or repeat the session.'
          if old not in h: raise SystemExit('missing old EN language note')
          h=h.replace(old,new,1)
          old_lt='Dabartinis Open14 formuojamasis pilotas vyksta lietuviškai. Užbaigęs galėsi grįžti į 2rasi arba atlikti sesiją dar kartą.'
          new_lt='Open14 seka svetainės kalbą: lietuviškai 2rasi.lt ir angliškai 2rasi.com. Užbaigęs galėsi grįžti į 2rasi arba atlikti sesiją dar kartą.'
          if old_lt not in h: raise SystemExit('missing old LT language note')
          h=h.replace(old_lt,new_lt,1)
          h=h.replace('https://omesg360.eu/priolens-open14-v02/?from=com','https://omesg360.eu/priolens-open14-v02/?from=com&lang=en')
          old_script="const from=(h==='2rasi.lt'||h.endsWith('.2rasi.lt'))?'lt':'com';\n  const url=`https://omesg360.eu/priolens-open14-v02/?from=${from}`;"
          new_script="const from=(h==='2rasi.lt'||h.endsWith('.2rasi.lt'))?'lt':'com';\n  const lang=from==='lt'?'lt':'en';\n  const url=`https://omesg360.eu/priolens-open14-v02/?from=${from}&lang=${lang}`;"
          if old_script not in h: raise SystemExit('missing entry URL script')
          h=h.replace(old_script,new_script,1)
          p.write_text(h)
          PY
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          grep -q "lang=\${lang}" tools/priolens/index.html
          grep -q 'English on 2rasi.com and Lithuanian on 2rasi.lt' tools/priolens/index.html
          grep -q 'lietuviškai 2rasi.lt ir angliškai 2rasi.com' tools/priolens/index.html
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/priolens/index.html
          git commit -m 'feat(priolens): route LT and EN landing to matching runtime'
          git push origin HEAD:feature/priolens-architecture
