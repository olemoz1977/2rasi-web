name: One-time fix Drama Triangle card status

on:
  push:
    branches: [hero-webgl]
    paths:
      - .github/workflows/one-time-fix-drama-card-status.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hero-webgl
      - name: Fix i18n status
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('i18n.js')
          s = p.read_text(encoding='utf-8')
          old = "karpman: {\n      state: ['Live · LT', 'Veikia · LT'],"
          new = "karpman: {\n      state: ['Live · EN/LT', 'Veikia · EN/LT'],"
          if old not in s:
              raise SystemExit('Drama Triangle old status not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Verify
        run: grep -F "state: ['Live · EN/LT', 'Veikia · EN/LT']" i18n.js
      - name: Commit
        run: |
          rm .github/workflows/one-time-fix-drama-card-status.yml
          git config user.name 'olemoz1977'
          git config user.email 'olemoz1977@gmail.com'
          git add i18n.js .github/workflows/one-time-fix-drama-card-status.yml
          git commit -m 'fix(i18n): mark Drama Triangle EN/LT'
          git push origin HEAD:hero-webgl
