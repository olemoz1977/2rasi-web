name: Patch PrioLens homepage card copy v01

on:
  push:
    branches: [feature/priolens-architecture]
    paths:
      - .github/workflows/patch-priolens-card-copy-v01.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/priolens-architecture
      - name: Patch card hook
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='data-en="When two things matter, what takes priority?" data-lt="Kai svarbūs abu, kam teiki pirmenybę?">When two things matter, what takes priority?'
          new='data-en="When several things matter, what pulls you first?" data-lt="Kai svarbūs keli dalykai, kas patraukia pirmiausia?">When several things matter, what pulls you first?'
          if old not in s:
              raise SystemExit('PrioLens card hook anchor not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix(priolens): align card hook with triad task'
          git push origin HEAD:feature/priolens-architecture
