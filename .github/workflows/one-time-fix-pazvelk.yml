name: Fix LT hero PAZVELK

on:
  push:
    branches: [hero-webgl]
    paths:
      - .github/workflows/one-time-fix-pazvelk.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hero-webgl
          fetch-depth: 0

      - name: Patch LT hero wording
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          css = Path('hero.css')
          s = css.read_text(encoding='utf-8')
          old = "html[lang=\"lt\"] .perception-stage.webgl-active .base-word::before {\n  content: 'STEBĖK';\n}"
          new = "html[lang=\"lt\"] .perception-stage.webgl-active .base-word::before {\n  content: 'PAŽVELK';\n}"
          if old not in s:
              raise SystemExit('Expected STEBĖK WebGL override not found')
          css.write_text(s.replace(old, new, 1), encoding='utf-8')

          i18n = Path('i18n.js')
          s = i18n.read_text(encoding='utf-8')
          old = "set('.base-word', 'OBSERVE', 'STEBĖK');"
          new = "set('.base-word', 'OBSERVE', 'PAŽVELK');"
          if old not in s:
              raise SystemExit('Expected STEBĖK i18n mapping not found')
          i18n.write_text(s.replace(old, new, 1), encoding='utf-8')

          index = Path('index.html')
          s = index.read_text(encoding='utf-8')
          s = s.replace('hero.css?v=20260825-ltwords', 'hero.css?v=20260825-pazvelk')
          s = s.replace('hero.css?v=20260816-1145', 'hero.css?v=20260825-pazvelk')
          s = s.replace('i18n.js?v=20260825-trust', 'i18n.js?v=20260825-pazvelk')
          index.write_text(s, encoding='utf-8')
          PY

      - name: Verify
        run: |
          grep -q "content: 'PAŽVELK'" hero.css
          grep -q "set('.base-word', 'OBSERVE', 'PAŽVELK');" i18n.js
          grep -q 'hero.css?v=20260825-pazvelk' index.html
          grep -q 'i18n.js?v=20260825-pazvelk' index.html

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-time-fix-pazvelk.yml
          git config user.name 'olemoz1977'
          git config user.email 'olemoz1977@gmail.com'
          git add hero.css i18n.js index.html .github/workflows/one-time-fix-pazvelk.yml
          git commit -m 'fix(i18n): use PAŽVELK before PASTEBĖK on LT hero'
          git push origin HEAD:hero-webgl
