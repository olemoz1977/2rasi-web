name: Patch PrioLens bilingual docs v01

on:
  push:
    branches: [feature/priolens-architecture]
    paths:
      - .github/workflows/patch-priolens-bilingual-docs-v01.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/priolens-architecture
      - name: Patch source-of-truth docs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def one(s,old,new,label):
              if old not in s: raise SystemExit(f'missing anchor: {label}')
              return s.replace(old,new,1)

          p=Path('tools/priolens/RESUME_HERE.md'); s=p.read_text()
          s=one(s,
            'Status: ACTIVE / OPEN14 v0.2 / OWNER ASSET REVIEW COMPLETE / MOBILE UX HARDENED / PARTICIPANT COMPLETION LIVE / PRE-PILOT HARDENING',
            'Status: ACTIVE / OPEN14 v0.2 / OWNER ASSET REVIEW COMPLETE / MOBILE UX HARDENED / PARTICIPANT COMPLETION LIVE / BILINGUAL LT+EN LIVE / PRE-PILOT HARDENING','resume status')
          s=one(s,
            '3. read `docs/OPEN14_PARTICIPANT_COMPLETION_v0.1.md` as the latest active checkpoint;\n4. read `docs/OPEN14_MOBILE_ACCESSIBILITY_HARDENING_v0.1.md`;\n5. read `docs/OPEN14_FINAL_ASSET_BANK_v0.1.md` for the finalized active stimulus bank;\n6. read older docs / File Library only when needed.',
            '3. read `docs/OPEN14_BILINGUAL_RUNTIME_v0.1.md` as the latest active checkpoint;\n4. read `docs/OPEN14_PARTICIPANT_COMPLETION_v0.1.md`;\n5. read `docs/OPEN14_MOBILE_ACCESSIBILITY_HARDENING_v0.1.md`;\n6. read `docs/OPEN14_FINAL_ASSET_BANK_v0.1.md` for the finalized active stimulus bank;\n7. read older docs / File Library only when needed.','resume order')
          s=one(s,
            'If an older runtime / UX section conflicts with the latest participant-completion checkpoint, the latest checkpoint wins.',
            'If an older runtime / UX / language section conflicts with the bilingual-runtime checkpoint, the bilingual checkpoint wins.','resume precedence')
          s=one(s,
            '- raw JSON export and diagnostics hidden from normal participants.',
            '- raw JSON export and diagnostics hidden from normal participants;\n- one bilingual LT/EN runtime selected by `lang=lt|en`;\n- `language` stored in new session payloads;\n- language-separated local drafts.','resume runtime list')
          s=one(s,
            'Latest active checkpoint:\n`docs/OPEN14_PARTICIPANT_COMPLETION_v0.1.md`',
            '### Bilingual LT/EN runtime now live\n\nRuntime commit:\n`b97c06e876cf2df0b0f3af3d043465d66b2ff845`\n\nWorkflow run:\n`33544864679` — SUCCESS.\n\nRouting:\n- `lang=lt&from=lt` -> LT participant UI / return to 2rasi.lt;\n- `lang=en&from=com` -> EN participant UI / return to 2rasi.com;\n- new session payloads include `language: lt|en`;\n- old LT v0.2 payloads without `language` remain valid.\n\nRetention wording is now provisional (`numatyta` / `intended`) until cleanup cron is operational.\n\nLatest active checkpoint:\n`docs/OPEN14_BILINGUAL_RUNTIME_v0.1.md`\n\nPrevious participant-completion checkpoint:\n`docs/OPEN14_PARTICIPANT_COMPLETION_v0.1.md`','resume bilingual section')
          s=one(s,
            'The PrioLens landing page was updated from obsolete 8-direction / 28-pair copy to the current Open14 flow in commit:\n`9af3081f88cb0172afc61413bdeda25e717ec138`.',
            'The PrioLens landing page is aligned with Open14 and bilingual routing. Latest landing commit:\n`8cc8e2d03506f021119e5c4465427b5af86754fa`.','resume landing commit')
          s=one(s,
            'Current Open14 participant runtime itself is LT-only. The `.com` landing states this explicitly rather than implying an English runtime already exists.',
            'Open14 participant runtime is now bilingual. The prepared landing routes 2rasi.lt to LT and 2rasi.com to EN.','resume language state')
          old='''## Remaining pre-pilot hardening

1. run one fresh full mobile participant smoke including `Trumpai`, coverage states, restart and 2rasi return;
2. preserve CARE visual-giving vs received-support asymmetry explicitly in final wording / logic documentation;
3. configure and smoke 90-day cleanup cron;
4. decide whether first external formative release is LT-only or requires EN runtime first;
5. intentionally merge / deploy the prepared 10th-card PrioLens entry route only when recruitment opens.'''
          new='''## Remaining pre-pilot hardening

1. run one fresh full mobile participant smoke in LT and one focused EN smoke, including `Trumpai`, coverage states, restart and 2rasi return;
2. freeze CARE visual-giving vs received-support asymmetry explicitly as an analysis rule;
3. configure and smoke the 90-day cleanup cron;
4. clean or explicitly exclude owner / household / system test rows before pilot analysis;
5. intentionally merge / deploy the prepared 10th-card PrioLens entry route only when recruitment opens.'''
          s=one(s,old,new,'resume remaining')
          p.write_text(s)

          p=Path('tools/priolens/PROJECT_STATE.md'); s=p.read_text()
          s=one(s,
            'Status: ACTIVE RESEARCH / OPEN14 v0.2 / OWNER ASSET REVIEW COMPLETE / MOBILE UX HARDENED / PARTICIPANT COMPLETION LIVE / PRE-PILOT HARDENING',
            'Status: ACTIVE RESEARCH / OPEN14 v0.2 / OWNER ASSET REVIEW COMPLETE / MOBILE UX HARDENED / PARTICIPANT COMPLETION LIVE / BILINGUAL LT+EN LIVE / PRE-PILOT HARDENING','state status')
          s=one(s,
            '1. `RESUME_HERE.md`\n2. `docs/OPEN14_PARTICIPANT_COMPLETION_v0.1.md`\n3. `docs/OPEN14_MOBILE_ACCESSIBILITY_HARDENING_v0.1.md`\n4. `docs/OPEN14_FINAL_ASSET_BANK_v0.1.md`\n5. this file\n6. older architecture docs only as needed',
            '1. `RESUME_HERE.md`\n2. `docs/OPEN14_BILINGUAL_RUNTIME_v0.1.md`\n3. `docs/OPEN14_PARTICIPANT_COMPLETION_v0.1.md`\n4. `docs/OPEN14_MOBILE_ACCESSIBILITY_HARDENING_v0.1.md`\n5. `docs/OPEN14_FINAL_ASSET_BANK_v0.1.md`\n6. this file\n7. older architecture docs only as needed','state order')
          s=one(s,
            '- raw JSON export and diagnostics hidden from normal participant mode.',
            '- raw JSON export and diagnostics hidden from normal participant mode;\n- one bilingual LT/EN participant runtime;\n- `language: lt|en` stored in new payloads;\n- language-separated local drafts.','state runtime list')
          marker='''## Perceived sufficiency
'''
          insert='''### Bilingual LT/EN runtime

Runtime commit:
`b97c06e876cf2df0b0f3af3d043465d66b2ff845`

Workflow run:
`33544864679` — SUCCESS.

One runtime serves both languages:
- LT: `?lang=lt&from=lt`;
- EN: `?lang=en&from=com`.

The visual bank / planner / exemplar logic / storage schema are shared.
Channel B uses the same 12 item IDs and semantically matched LT/EN wording.
New payloads store `language: lt|en`; historical v0.2 rows without language remain valid.
Language must be retained during analysis before deciding whether LT and EN observations can be pooled.

'''
          if marker not in s: raise SystemExit('missing perceived marker')
          s=s.replace(marker,insert+marker,1)
          s=one(s,
            'Landing CTA points to the omesg360 runtime with `from=lt|com`, allowing the result screen to return to the correct 2rasi domain.',
            'Landing CTA points to the omesg360 runtime with both origin and language: 2rasi.lt -> `from=lt&lang=lt`; 2rasi.com -> `from=com&lang=en`.','state landing route')
          s=one(s,
            'Current Open14 participant runtime is LT-only; the `.com` landing states this limitation explicitly.\n\nLatest checkpoint:\n`docs/OPEN14_PARTICIPANT_COMPLETION_v0.1.md`',
            'Open14 participant runtime is bilingual LT/EN.\n\nLatest checkpoint:\n`docs/OPEN14_BILINGUAL_RUNTIME_v0.1.md`','state language checkpoint')
          old='''## Remaining pre-pilot hardening

1. run one fresh full mobile participant smoke including the new summary, coverage states, restart and 2rasi return;
2. preserve CARE giving-vs-received-support asymmetry explicitly in final wording / logic documentation;
3. configure and smoke 90-day cleanup cron;
4. decide whether first external formative release is LT-only or requires EN runtime first;
5. intentionally merge / deploy the prepared PrioLens 10th-card route only when recruitment opens.'''
          new='''## Remaining pre-pilot hardening

1. run one fresh full mobile participant smoke in LT and one focused EN smoke, including summary, coverage states, restart and return;
2. freeze CARE giving-vs-received-support asymmetry explicitly as an analysis rule;
3. configure and smoke the 90-day cleanup cron;
4. clean or explicitly exclude owner / household / system test rows before pilot analysis;
5. intentionally merge / deploy the prepared PrioLens 10th-card route only when recruitment opens.'''
          s=one(s,old,new,'state remaining')
          p.write_text(s)
          PY
      - name: Commit docs
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/priolens/RESUME_HERE.md tools/priolens/PROJECT_STATE.md
          git commit -m 'docs(priolens): make bilingual runtime current source of truth'
          git push origin HEAD:feature/priolens-architecture
