name: One-time restore Drama action loop

on:
  push:
    branches: [hero-webgl]
    paths:
      - .github/workflows/one-time-restore-drama-action-loop.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hero-webgl

      - name: Restore LT and EN action-loop runtimes from pinned source
        env:
          SOURCE_SHA: 3f931276a58969ce3c7e32cdd764980e96d7803d
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import urlopen
          import os

          sha = os.environ['SOURCE_SHA']
          base = f'https://raw.githubusercontent.com/olemoz1977/karpman-apklausa/{sha}/public/pilot/action-loop-v01'
          pairs = [
              (f'{base}/index.html', Path('tools/drama-triangle/run/index.html')),
              (f'{base}/en/index.html', Path('tools/drama-triangle/run/en/index.html')),
          ]
          for url, dst in pairs:
              text = urlopen(url, timeout=30).read().decode('utf-8')
              text = text.replace('content="noindex,nofollow"', 'content="noindex,follow"')
              dst.parent.mkdir(parents=True, exist_ok=True)
              dst.write_text(text, encoding='utf-8')
          PY

      - name: Verify restored product
        run: |
          grep -F 'Pastebėti neužtenka. Ką norėtum pabandyti kitaip?' tools/drama-triangle/run/index.html
          grep -F 'Noticing is not enough. What would you like to try differently?' tools/drama-triangle/run/en/index.html
          grep -F 'direction-grid' tools/drama-triangle/run/index.html
          grep -F 'followupSection' tools/drama-triangle/run/en/index.html
          grep -F 'noindex,follow' tools/drama-triangle/run/index.html
          grep -F 'noindex,follow' tools/drama-triangle/run/en/index.html

      - name: Commit restored runtime
        run: |
          rm .github/workflows/one-time-restore-drama-action-loop.yml
          git config user.name 'olemoz1977'
          git config user.email 'olemoz1977@gmail.com'
          git add tools/drama-triangle/run/index.html tools/drama-triangle/run/en/index.html .github/workflows/one-time-restore-drama-action-loop.yml
          git commit -m 'fix(drama): restore action-loop product after migration'
          git push origin HEAD:hero-webgl
