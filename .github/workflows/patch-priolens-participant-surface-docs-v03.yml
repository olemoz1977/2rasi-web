name: Patch PrioLens participant surface docs v03

on:
  push:
    branches: [feature/priolens-architecture]
    paths:
      - .github/workflows/patch-priolens-participant-surface-docs-v03.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/priolens-architecture
          fetch-depth: 0

      - name: Reconcile current docs
        shell: python
        run: |
          from pathlib import Path

          p=Path('tools/priolens/RESUME_HERE.md')
          s=p.read_text()
          old='If an older runtime / UX section conflicts with the pre-pilot smoke checkpoint, the smoke checkpoint wins. The bilingual-runtime checkpoint remains canonical for language architecture.'
          new='If an older runtime / UX section conflicts with the pre-pilot smoke checkpoint, the smoke checkpoint wins. For participant intro / result presentation, `OPEN14_PARTICIPANT_SURFACE_v0.1.md` wins over the older participant-completion presentation. The bilingual-runtime checkpoint remains canonical for language architecture.'
          if old not in s: raise SystemExit('RESUME precedence anchor missing')
          s=s.replace(old,new,1)
          old='- participant-facing short synthesis (`Trumpai / In short`);\n- coverage-aware sufficiency result rendering;'
          new='- participant-facing three-part result hierarchy (`Pirmas žvilgsnis / First glance` -> `Antras atsakymas / Second answer` -> `Pažvelk dar kartą / Look again`);\n- coverage-aware sufficiency logic with incomplete domains omitted from complete participant interpretation;'
          if old not in s: raise SystemExit('RESUME runtime bullets anchor missing')
          s=s.replace(old,new,1)
          old='''Changes:\n- result starts with a short participant-facing synthesis;\n- `Nauja sesija` became `Atlikti dar kartą`;'''
          new='''Changes at that checkpoint:\n- result originally gained a short participant-facing synthesis; this presentation is now superseded by `OPEN14_PARTICIPANT_SURFACE_v0.1.md`, while the underlying coverage rule remains active;\n- `Nauja sesija` became `Atlikti dar kartą`;'''
          if old not in s: raise SystemExit('RESUME historical completion anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('tools/priolens/PROJECT_STATE.md')
          s=p.read_text()
          old='- participant-facing short synthesis;\n- coverage-aware sufficiency result rendering;'
          new='- participant-facing three-part result hierarchy (`First glance -> Second answer -> Look again`);\n- coverage-aware sufficiency logic with incomplete domains excluded from complete participant interpretation;'
          if old not in s: raise SystemExit('PROJECT_STATE runtime bullets anchor missing')
          s=s.replace(old,new,1)
          anchor='''### Participant completion flow\n\nInformal household testing exposed a product completion failure: after reading the result, the participant asked what happens next.'''
          repl='''### Participant completion flow\n\nHistorical note: the later checkpoint `docs/OPEN14_PARTICIPANT_SURFACE_v0.1.md` supersedes the old `Trumpai / In short` result presentation. The completion actions and 0/2–1/2–2/2 coverage validity rule remain active, but technical coverage counts are no longer shown in normal participant results.\n\nInformal household testing exposed a product completion failure: after reading the result, the participant asked what happens next.'''
          if anchor not in s: raise SystemExit('PROJECT_STATE completion anchor missing')
          s=s.replace(anchor,repl,1)
          p.write_text(s)

      - name: Validate consistency
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'OPEN14_PARTICIPANT_SURFACE_v0.1.md.*wins' tools/priolens/RESUME_HERE.md
          grep -q 'participant-facing three-part result hierarchy' tools/priolens/RESUME_HERE.md
          grep -q 'superseded by `OPEN14_PARTICIPANT_SURFACE_v0.1.md`' tools/priolens/RESUME_HERE.md
          grep -q 'later checkpoint `docs/OPEN14_PARTICIPANT_SURFACE_v0.1.md` supersedes' tools/priolens/PROJECT_STATE.md

      - name: Commit docs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/priolens/RESUME_HERE.md tools/priolens/PROJECT_STATE.md
          git commit -m 'docs(priolens): reconcile participant surface state'
          git push origin HEAD:feature/priolens-architecture
