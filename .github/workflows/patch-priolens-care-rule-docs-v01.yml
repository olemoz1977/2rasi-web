name: Patch PrioLens CARE rule docs v01

on:
  push:
    branches: [feature/priolens-architecture]
    paths:
      - .github/workflows/patch-priolens-care-rule-docs-v01.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/priolens-architecture
      - name: Patch source of truth
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          def rep(s,a,b,label):
              if a not in s: raise SystemExit('missing '+label)
              return s.replace(a,b,1)

          p=Path('tools/priolens/RESUME_HERE.md'); s=p.read_text()
          s=rep(s,
          '3. read `docs/OPEN14_BILINGUAL_RUNTIME_v0.1.md` as the latest active checkpoint;\n4. read `docs/OPEN14_PARTICIPANT_COMPLETION_v0.1.md`;',
          '3. read `docs/OPEN14_CARE_ANALYSIS_RULE_v0.1.md` for the frozen CARE boundary;\n4. read `docs/OPEN14_BILINGUAL_RUNTIME_v0.1.md` as the latest runtime checkpoint;\n5. read `docs/OPEN14_PARTICIPANT_COMPLETION_v0.1.md`;',
          'resume order')
          s=s.replace('5. read `docs/OPEN14_MOBILE_ACCESSIBILITY_HARDENING_v0.1.md`;\n6. read `docs/OPEN14_FINAL_ASSET_BANK_v0.1.md` for the finalized active stimulus bank;\n7. read older docs / File Library only when needed.',
                      '6. read `docs/OPEN14_MOBILE_ACCESSIBILITY_HARDENING_v0.1.md`;\n7. read `docs/OPEN14_FINAL_ASSET_BANK_v0.1.md` for the finalized active stimulus bank;\n8. read older docs / File Library only when needed.',1)
          s=rep(s,
          '2. freeze CARE visual-giving vs received-support asymmetry explicitly as an analysis rule;\n3. configure and smoke the 90-day cleanup cron;',
          '2. configure and smoke the 90-day cleanup cron;',
          'resume remaining care')
          insert='''\n### CARE boundary frozen\n\nCanonical analysis rule:\n`docs/OPEN14_CARE_ANALYSIS_RULE_v0.1.md`\n\nOpen14 v0.2 intentionally does **not** compare visual CARE directly with `CARE_SUPPORT_PRESENT`. Visual CARE = proactive care-giving; Channel B item = care/support present or received. Keep both, but do not treat them as equivalent constructs.\n'''
          marker='\n## Stimulus bank state\n'
          if marker not in s: raise SystemExit('missing resume marker')
          s=s.replace(marker,insert+marker,1)
          p.write_text(s)

          p=Path('tools/priolens/PROJECT_STATE.md'); s=p.read_text()
          s=rep(s,
          '1. `RESUME_HERE.md`\n2. `docs/OPEN14_BILINGUAL_RUNTIME_v0.1.md`',
          '1. `RESUME_HERE.md`\n2. `docs/OPEN14_CARE_ANALYSIS_RULE_v0.1.md`\n3. `docs/OPEN14_BILINGUAL_RUNTIME_v0.1.md`',
          'state order')
          s=s.replace('3. `docs/OPEN14_PARTICIPANT_COMPLETION_v0.1.md`\n4. `docs/OPEN14_MOBILE_ACCESSIBILITY_HARDENING_v0.1.md`\n5. `docs/OPEN14_FINAL_ASSET_BANK_v0.1.md`\n6. this file\n7. older architecture docs only as needed',
                      '4. `docs/OPEN14_PARTICIPANT_COMPLETION_v0.1.md`\n5. `docs/OPEN14_MOBILE_ACCESSIBILITY_HARDENING_v0.1.md`\n6. `docs/OPEN14_FINAL_ASSET_BANK_v0.1.md`\n7. this file\n8. older architecture docs only as needed',1)
          old='''Open conceptual issues:\n1. visual CARE = proactive / giving care, while `CARE_SUPPORT_PRESENT` measures care/support present or received; do not treat them as construct-equivalent;\n2. Meaning / Contribution has no active visual counterpart.\n\nCurrent comparison logic does not directly map CARE into CONNECTION_SUPPORT; that asymmetry must be frozen as an analysis rule before external pilot.'''
          new='''CARE asymmetry is CLOSED as a pre-pilot ambiguity by `docs/OPEN14_CARE_ANALYSIS_RULE_v0.1.md`:\n- visual CARE = proactive / giving care;\n- `CARE_SUPPORT_PRESENT` = care/support present or received;\n- no direct CARE <-> CARE_SUPPORT_PRESENT comparison in v0.2;\n- current result logic correctly excludes CARE from CONNECTION_SUPPORT comparison.\n\nRemaining conceptual asymmetry:\n- Meaning / Contribution has no active visual counterpart; keep it contextual-only rather than inventing symmetry.'''
          s=rep(s,old,new,'state care block')
          s=rep(s,
          '2. freeze CARE giving-vs-received-support asymmetry explicitly as an analysis rule;\n3. configure and smoke the 90-day cleanup cron;',
          '2. configure and smoke the 90-day cleanup cron;',
          'state remaining care')
          p.write_text(s)
          PY
      - name: Commit docs
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/priolens/RESUME_HERE.md tools/priolens/PROJECT_STATE.md
          git commit -m 'docs(priolens): freeze CARE analysis boundary'
          git push origin HEAD:feature/priolens-architecture
