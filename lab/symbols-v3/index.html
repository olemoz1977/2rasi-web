<style>

*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-snap-type:y proximity}body{margin:0;color:var(--ink);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#bfd5dc}

body::after{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(circle at 50% 25%,rgba(255,255,255,.34),transparent 42%),linear-gradient(180deg,rgba(255,255,255,.04),rgba(4,35,52,.18))}

.card-section{min-height:100svh;display:grid;place-items:center;padding:92px 16px 40px;scroll-snap-align:start}.card{width:min(980px,92vw);min-height:min(700px,80svh);display:grid;grid-template-columns:1.03fr .97fr;border:1px solid var(--line);border-radius:34px;background:linear-gradient(150deg,rgba(249,254,255,.36),rgba(207,231,238,.14));backdrop-filter:blur(18px) saturate(1.06);box-shadow:0 30px 80px rgba(4,31,48,.18);overflow:hidden}.copy{padding:clamp(28px,5vw,68px);display:flex;flex-direction:column;justify-content:center}.num{font-size:.66rem;letter-spacing:.19em;opacity:.42}.copy h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(3.5rem,8vw,7rem);font-weight:500;letter-spacing:-.06em;line-height:.9;margin:22px 0 16px}.hook{margin:0;max-width:470px;font-size:clamp(1.05rem,2vw,1.35rem);line-height:1.48;color:var(--soft)}.tap{margin-top:24px;font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;opacity:.42}.visual{position:relative;min-height:420px;display:grid;place-items:center;overflow:hidden;touch-action:manipulation}.visual::after{content:"";position:absolute;width:78%;height:18%;left:11%;bottom:14%;border-radius:50%;background:radial-gradient(ellipse,rgba(2,54,78,.2),transparent 68%);filter:blur(14px)}

.multiplier-stage{position:relative;width:min(400px,80vw);aspect-ratio:1}.m-source{position:absolute;z-index:5;left:50%;top:11%;width:88px;aspect-ratio:1;border-radius:50%;transform:translateX(-50%);background:radial-gradient(circle at 33% 24%,rgba(255,255,255,.96),rgba(157,207,219,.3) 36%,rgba(7,55,76,.34));border:1px solid rgba(255,255,255,.72);box-shadow:0 18px 40px rgba(3,39,57,.18)}.m-ring{position:absolute;z-index:2;left:50%;top:61%;width:90px;height:26px;border:2px solid rgba(75,154,176,.72);border-radius:50%;transform:translate(-50%,-50%) scale(.2);opacity:0}.m-orb{position:absolute;z-index:3;width:46px;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 26%,rgba(255,255,255,.9),rgba(79,136,157,.38));border:1px solid rgba(255,255,255,.62);opacity:.34;transform:scale(.72)}.mo1{left:7%;bottom:13%}.mo2{left:44%;bottom:3%}.mo3{right:7%;bottom:15%}
/* WORKSTYLE: START → TWO ROUTES → SAME DESTINATION */
.work-stage{position:relative;width:min(430px,84vw);height:330px}.route-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.route-svg .route{fill:none;stroke-width:5;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;filter:drop-shadow(0 0 6px rgba(226,250,255,.5))}.route-a{stroke:rgba(117,211,231,.9)}.route-b{stroke:rgba(38,123,151,.82)}.route-svg .guide{fill:none;stroke:rgba(255,255,255,.2);stroke-width:1.2}.start-dot,.finish-dot{position:absolute;z-index:6;top:50%;width:28px;aspect-ratio:1;border-radius:50%;transform:translateY(-50%);background:rgba(241,252,254,.9);border:2px solid rgba(39,111,137,.62);box-shadow:0 0 0 7px rgba(255,255,255,.11)}.start-dot{left:3%}.finish-dot{right:3%}.finish-dot::after{content:"";position:absolute;inset:-10px;border:2px solid rgba(93,184,205,.55);border-radius:50%;opacity:0}.obstacle{position:absolute;z-index:5;left:50%;top:50%;width:102px;height:124px;transform:translate(-50%,-50%);border-radius:49% 51% 45% 55%/55% 43% 57% 45%;background:radial-gradient(circle at 34% 27%,rgba(255,255,255,.66),rgba(76,103,111,.78));box-shadow:0 20px 36px rgba(4,37,52,.23)}.traveller{position:absolute;z-index:7;width:22px;aspect-ratio:1;border-radius:50%;background:#effcff;border:1px solid rgba(43,123,149,.68);box-shadow:0 0 18px rgba(185,238,249,.95);opacity:0}.traveller.a{left:6%;top:48%}.traveller.b{left:6%;top:48%}

.strat-stage{position:relative;width:min(430px,84vw);height:350px}.waterline{position:absolute;z-index:5;left:4%;right:4%;top:46%;height:2px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.95),rgba(74,155,178,.74),rgba(255,255,255,.95),transparent);box-shadow:0 0 14px rgba(255,255,255,.55)}.island{position:absolute;z-index:7;top:34%;width:52px;height:38px;border-radius:50% 48% 44% 56%;background:radial-gradient(circle at 35% 25%,rgba(255,255,255,.9),rgba(69,101,113,.78));box-shadow:0 12px 24px rgba(3,39,57,.19)}.i1{left:15%}.i2{left:44%;top:30%;width:60px;height:44px}.i3{right:14%;top:35%;width:48px;height:36px}.hidden-system{position:absolute;z-index:3;left:7%;right:7%;top:45%;bottom:7%;opacity:.05;filter:blur(3px);transform:translateY(10px)}.hidden-system svg{width:100%;height:100%;overflow:visible}.root{fill:none;stroke:rgba(21,90,116,.74);stroke-width:8;stroke-linecap:round;stroke-linejoin:round}.root-thin{fill:none;stroke:rgba(93,174,195,.7);stroke-width:4;stroke-linecap:round}.deep-node{fill:rgba(228,247,251,.88);stroke:rgba(25,94,119,.75);stroke-width:2}.reveal-lens{position:absolute;z-index:4;left:50%;top:47%;width:130px;height:165px;transform:translate(-50%,-8%) scale(.7);border-radius:50%;background:radial-gradient(ellipse,rgba(255,255,255,.46),rgba(210,241,247,.16) 55%,transparent 72%);filter:blur(3px);opacity:0}.s-ring{position:absolute;z-index:6;left:50%;top:46%;width:76px;height:22px;border:2px solid rgba(69,153,177,.72);border-radius:50%;transform:translate(-50%,-50%) scale(.2);opacity:0}
@media(max-width:720px){.card{grid-template-columns:1fr;min-height:84svh;border-radius:28px}.copy{padding:28px 28px 10px}.copy h1{font-size:clamp(3.1rem,15vw,5.1rem);margin:14px 0 10px}.hook{font-size:1rem}.visual{min-height:325px}.multiplier-stage{width:300px}.m-source{width:70px}.m-orb{width:40px}.work-stage,.strat-stage{width:315px;height:285px}.obstacle{width:82px;height:100px}.start-dot,.finish-dot{width:24px}.island{transform:scale(.86);transform-origin:center bottom}}

@keyframes mRing{0%,33%{transform:translate(-50%,-50%) scale(.2);opacity:0}42%{opacity:.95}69%{transform:translate(-50%,-50%) scale(4.5,2.35);opacity:0}100%{opacity:0}}

@keyframes mGrow3{0%,53%,100%{transform:translateY(0) scale(.72);opacity:.34}69%{transform:translateY(-22px) scale(1.5);opacity:1}88%{transform:translateY(-6px) scale(1.16);opacity:.72}}
.card.in-view .route-a,.card.in-view .route-b{animation:drawRoute 6.2s cubic-bezier(.45,0,.2,1) infinite}.card.in-view .route-b{animation-delay:.3s}.card.in-view .traveller.a{animation:travelA 6.2s ease-in-out infinite}.card.in-view .traveller.b{animation:travelB 6.2s ease-in-out infinite}.card.in-view .finish-dot::after{animation:finishPulse 6.2s ease-out infinite}
@keyframes drawRoute{0%,10%,100%{stroke-dashoffset:1;opacity:.14}30%,73%{stroke-dashoffset:0;opacity:1}88%{opacity:.34}}
@keyframes travelA{0%,20%,100%{left:6%;top:48%;opacity:0}25%{opacity:1}38%{left:29%;top:25%;opacity:1}54%{left:62%;top:25%;opacity:1}68%{left:89%;top:48%;opacity:1}76%{opacity:0}}
@keyframes travelB{0%,28%,100%{left:6%;top:48%;opacity:0}33%{opacity:1}46%{left:29%;top:70%;opacity:1}60%{left:62%;top:70%;opacity:1}74%{left:89%;top:48%;opacity:1}82%{opacity:0}}

.card.in-view .hidden-system{animation:systemReveal 6s ease-in-out infinite}.card.in-view .reveal-lens{animation:lensReveal 6s cubic-bezier(.42,0,.18,1) infinite}.card.in-view .s-ring{animation:sRing 6s ease-out infinite}.card.in-view .island{animation:islandSet 6s ease-in-out infinite}.card.in-view .i2{animation-delay:-.18s}.card.in-view .i3{animation-delay:-.34s}
@keyframes systemReveal{0%,18%,100%{opacity:.04;filter:blur(3px);transform:translateY(10px)}38%,72%{opacity:.92;filter:blur(0);transform:translateY(0)}86%{opacity:.18;filter:blur(1.5px)}}
@keyframes lensReveal{0%,20%,100%{transform:translate(-50%,-8%) scale(.65);opacity:0}34%{opacity:.8}62%{transform:translate(-50%,20%) scale(1.35);opacity:.6}76%{opacity:0}}
@keyframes sRing{0%,24%{transform:translate(-50%,-50%) scale(.2);opacity:0}34%{opacity:.9}58%{transform:translate(-50%,-50%) scale(4.8,2.4);opacity:0}100%{opacity:0}}
@keyframes islandSet{0%,100%{transform:translateY(0)}44%{transform:translateY(-5px)}66%{transform:translateY(1px)}}
}
@media(prefers-reduced-motion:reduce){.route{stroke-dashoffset:0!important}.hidden-system{opacity:.78;filter:none}.m-orb{transform:scale(1.15);opacity:.8}}

<script>
(()=>{const p=new URLSearchParams(location.search),h=location.hostname.toLowerCase(),l=p.get('lang')||((h==='2rasi.lt'||h.endsWith('.2rasi.lt'))?'lt':'en');document.documentElement.lang=l;document.querySelectorAll('[data-en]').forEach(e=>e.textContent=l==='lt'?e.dataset.lt:e.dataset.en);const cards=[...document.querySelectorAll('.card')];const replay=c=>{c.classList.remove('in-view');void c.offsetWidth;c.classList.add('in-view')};const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)replay(e.target)}),{threshold:.52});cards.forEach(c=>{io.observe(c);c.querySelector('.visual').addEventListener('click',()=>replay(c),{passive:true})});})();
