<style>

.work-stage{position:relative;width:min(420px,82vw);height:330px}.rock{position:absolute;z-index:4;left:50%;top:50%;width:124px;height:92px;transform:translate(-50%,-50%);border-radius:48% 52% 55% 45%/58% 46% 54% 42%;background:radial-gradient(circle at 35% 26%,rgba(255,255,255,.62),rgba(68,97,107,.68));box-shadow:0 18px 34px rgba(4,37,52,.22)}.flow{position:absolute;z-index:2;left:5%;right:5%;height:74px;top:50%;transform:translateY(-50%);overflow:visible}.flow path{fill:none;stroke-linecap:round;stroke-width:5;stroke:rgba(151,220,235,.78);filter:drop-shadow(0 0 8px rgba(230,250,255,.52));stroke-dasharray:1;stroke-dashoffset:1}.flow .alt{stroke:rgba(42,125,151,.72)}.merge{position:absolute;right:4%;top:50%;width:64px;height:20px;border:2px solid rgba(78,160,182,.55);border-radius:50%;transform:translateY(-50%) scale(.4);opacity:0}

@keyframes dropImpact{0%,14%,100%{transform:translateX(-50%) translateY(0) scale(1)}36%{transform:translateX(-50%) translateY(118px) scale(.88,1.1)}44%{transform:translateX(-50%) translateY(104px) scale(1.08,.88)}58%{transform:translateX(-50%) translateY(16px) scale(1)}}@keyframes ringOut{0%,34%{transform:translate(-50%,-50%) scale(.2);opacity:0}43%{opacity:.9}68%{transform:translate(-50%,-50%) scale(4.1,2.2);opacity:0}100%{opacity:0}}@keyframes orbWake1{0%,42%,100%{transform:translateY(0) scale(1);opacity:.42}57%{transform:translateY(-22px) scale(1.18);opacity:1}76%{transform:translateY(-5px);opacity:.68}}@keyframes orbWake2{0%,48%,100%{transform:translateY(0) scale(1);opacity:.42}63%{transform:translateY(-30px) scale(1.22);opacity:1}82%{transform:translateY(-6px);opacity:.68}}@keyframes orbWake3{0%,54%,100%{transform:translateY(0) scale(1);opacity:.42}69%{transform:translateY(-20px) scale(1.16);opacity:1}88%{transform:translateY(-4px);opacity:.68}}
.card.in-view .flow path{animation:flowRun 5.8s cubic-bezier(.45,0,.2,1) infinite}.card.in-view .flow .alt{animation-delay:.45s}.card.in-view .rock{animation:rockSet 5.8s ease-in-out infinite}.card.in-view .merge{animation:mergePulse 5.8s ease-out infinite}
@keyframes flowRun{0%,12%,100%{stroke-dashoffset:1;opacity:.15}38%,72%{stroke-dashoffset:0;opacity:1}86%{opacity:.35}}@keyframes rockSet{0%,100%{transform:translate(-50%,-50%) rotate(0)}44%{transform:translate(-50%,-50%) rotate(-2deg)}64%{transform:translate(-50%,-50%) rotate(2deg)}}@keyframes mergePulse{0%,56%{transform:translateY(-50%) scale(.4);opacity:0}70%{transform:translateY(-50%) scale(1);opacity:.8}88%{transform:translateY(-50%) scale(2.1);opacity:0}100%{opacity:0}}
.card.in-view .s-ripple{animation:strategicRipple 5.8s ease-out infinite}.card.in-view .network{animation:revealNetwork 5.8s ease-in-out infinite}.card.in-view .lens-sweep{animation:sweep 5.8s cubic-bezier(.45,0,.2,1) infinite}
@keyframes strategicRipple{0%,20%{transform:translate(-50%,-50%) scale(.2);opacity:0}30%{opacity:.9}58%{transform:translate(-50%,-50%) scale(4.5,2.5);opacity:0}100%{opacity:0}}@keyframes revealNetwork{0%,18%,100%{opacity:.06;filter:blur(2px)}42%,68%{opacity:.9;filter:blur(0)}82%{opacity:.24;filter:blur(1px)}}@keyframes sweep{0%,22%,100%{transform:translateX(0);opacity:0}32%{opacity:.65}66%{transform:translateX(245px);opacity:.55}78%{opacity:0}}
}

<section class="card-section"><article class="card" id="multipliers"><div class="copy"><span class="num">04</span><h1>Multipliers</h1><p class="hook" data-en="What does one small signal unlock in others?" data-lt="Ką vienas mažas signalas pažadina kituose?">What does one small signal unlock in others?</p><span class="tap" data-en="tap the visual to replay" data-lt="paliesk vaizdą ir pakartok">tap the visual to replay</span></div><div class="visual"><div class="multiplier-stage"><div class="m-drop"></div><div class="m-ring"></div><i class="m-orb mo1"></i><i class="m-orb mo2"></i><i class="m-orb mo3"></i></div></div></article></section>
<section class="card-section"><article class="card" id="workstyle"><div class="copy"><span class="num">05</span><h1>WorkStyle</h1><p class="hook" data-en="Different routes can still reach the same result." data-lt="Skirtingi keliai vis tiek gali nuvesti į tą patį rezultatą.">Different routes can still reach the same result.</p><span class="tap" data-en="tap the visual to replay" data-lt="paliesk vaizdą ir pakartok">tap the visual to replay</span></div><div class="visual"><div class="work-stage"><div class="rock"></div><svg class="flow" viewBox="0 0 100 30" preserveAspectRatio="none" aria-hidden="true"><path pathLength="1" d="M0 15 C24 15 30 3 50 3 C70 3 76 15 100 15"/><path class="alt" pathLength="1" d="M0 15 C24 15 30 27 50 27 C70 27 76 15 100 15"/></svg><div class="merge"></div></div></div></article></section>

<script>
(()=>{const p=new URLSearchParams(location.search),h=location.hostname.toLowerCase(),lang=p.get('lang')||((h==='2rasi.lt'||h.endsWith('.2rasi.lt'))?'lt':'en');document.documentElement.lang=lang;document.querySelectorAll('[data-en]').forEach(el=>el.textContent=lang==='lt'?el.dataset.lt:el.dataset.en);const cards=[...document.querySelectorAll('.card')];const io=new IntersectionObserver(es=>es.forEach(e=>e.target.classList.toggle('in-view',e.isIntersecting)),{threshold:.48});cards.forEach(c=>io.observe(c));document.querySelectorAll('.visual').forEach(v=>v.addEventListener('click',()=>{const c=v.closest('.card');c.classList.remove('in-view');void c.offsetWidth;c.classList.add('in-view')}));})();
