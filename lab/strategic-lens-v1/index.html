<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>2rasi · Strategic Thinking lens lab</title>
<style>
:root{--ink:#071b2e;--soft:rgba(7,27,46,.62);--line:rgba(255,255,255,.55)}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#bfd5dc;min-height:100svh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-3;background:linear-gradient(180deg,rgba(238,249,252,.14),rgba(8,45,64,.17)),url("../../assets/hero-2rasi.webp") center/cover no-repeat}
body::after{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(circle at 50% 24%,rgba(255,255,255,.34),transparent 42%),linear-gradient(180deg,rgba(255,255,255,.04),rgba(4,35,52,.16))}
a{color:inherit;text-decoration:none}.top{position:fixed;z-index:20;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:18px 20px;background:linear-gradient(180deg,rgba(220,239,245,.84),rgba(220,239,245,0));backdrop-filter:blur(4px)}.brand{font-size:1.4rem;font-weight:760;letter-spacing:-.05em}.back{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;opacity:.52}
.wrap{min-height:100svh;display:grid;place-items:center;padding:88px 16px 36px}.card{width:min(980px,92vw);min-height:min(720px,84svh);display:grid;grid-template-columns:1.02fr .98fr;border:1px solid var(--line);border-radius:34px;background:linear-gradient(150deg,rgba(249,254,255,.35),rgba(207,231,238,.12));backdrop-filter:blur(18px) saturate(1.06);box-shadow:0 30px 80px rgba(4,31,48,.18);overflow:hidden}.copy{padding:clamp(28px,5vw,68px);display:flex;flex-direction:column;justify-content:center}.num{font-size:.66rem;letter-spacing:.18em;opacity:.42}.copy h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(3.5rem,8vw,7rem);font-weight:500;letter-spacing:-.06em;line-height:.9;margin:22px 0 16px}.hook{margin:0;max-width:470px;font-size:clamp(1.05rem,2vw,1.35rem);line-height:1.48;color:var(--soft)}.triplet{margin-top:24px;display:flex;gap:12px;flex-wrap:wrap}.triplet span{font-size:.64rem;letter-spacing:.16em;text-transform:uppercase;padding:8px 11px;border:1px solid rgba(7,27,46,.14);border-radius:999px;background:rgba(255,255,255,.12)}.tap{margin-top:22px;font-size:.62rem;letter-spacing:.15em;text-transform:uppercase;opacity:.38}
.visual{position:relative;min-height:440px;display:grid;place-items:center;overflow:hidden;touch-action:manipulation}.stage{position:relative;width:min(430px,82vw);height:370px}.waterline{position:absolute;left:4%;right:4%;top:61%;height:2px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.95),rgba(77,156,177,.68),rgba(255,255,255,.95),transparent);box-shadow:0 0 12px rgba(255,255,255,.5)}
.obj{position:absolute;z-index:3;border:1px solid rgba(255,255,255,.68);box-shadow:0 18px 36px rgba(4,40,58,.18)}.o1{width:74px;height:74px;border-radius:50%;left:12%;top:40%;background:radial-gradient(circle at 33% 25%,rgba(255,255,255,.95),rgba(156,205,218,.32) 36%,rgba(7,55,76,.28))}.o2{width:86px;height:64px;border-radius:52% 48% 44% 56%/58% 50% 50% 42%;left:41%;top:34%;background:linear-gradient(145deg,rgba(255,255,255,.88),rgba(111,166,184,.3))}.o3{width:70px;height:82px;border-radius:46% 54% 58% 42%/44% 42% 58% 56%;right:10%;top:41%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.8),rgba(45,91,108,.56))}
.lens{position:absolute;z-index:6;left:50%;top:45%;width:150px;height:210px;border:2px solid rgba(255,255,255,.86);border-radius:44% 56% 52% 48%/48% 44% 56% 52%;transform:translate(-50%,-50%);background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(167,216,228,.08));box-shadow:inset 0 0 40px rgba(255,255,255,.2),0 18px 50px rgba(5,42,60,.12);backdrop-filter:blur(1.5px) saturate(1.08)}.lens::after{content:"";position:absolute;inset:8%;border-radius:inherit;border:1px solid rgba(255,255,255,.34)}
.ghost{position:absolute;z-index:2;left:44%;top:36%;width:84px;height:62px;border-radius:52% 48% 44% 56%/58% 50% 50% 42%;background:rgba(255,255,255,.2);filter:blur(2px);opacity:0}
.ripple{position:absolute;z-index:5;left:50%;top:61%;width:90px;height:26px;border:2px solid rgba(69,153,178,.72);border-radius:50%;transform:translate(-50%,-50%) scale(.2);opacity:0}.word{position:absolute;z-index:8;left:50%;bottom:7%;transform:translateX(-50%);font-family:Georgia,"Times New Roman",serif;font-size:clamp(2rem,7vw,3.5rem);letter-spacing:-.04em;opacity:0;white-space:nowrap}.hint{position:absolute;z-index:9;right:16px;bottom:12px;font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;opacity:.35}
@media(max-width:720px){.card{grid-template-columns:1fr;min-height:86svh;border-radius:28px}.copy{padding:28px 28px 8px}.copy h1{font-size:clamp(3.2rem,16vw,5.2rem);margin:14px 0 10px}.hook{font-size:1rem}.visual{min-height:340px}.stage{width:310px;height:310px}.o1{left:8%}.o3{right:7%}.lens{width:126px;height:174px}.word{bottom:3%}}
@media(prefers-reduced-motion:no-preference){
.stage.play .lens{animation:lensStory 7.4s cubic-bezier(.45,0,.16,1) both}.stage.play .o1{animation:obj1 7.4s cubic-bezier(.45,0,.16,1) both}.stage.play .o2{animation:obj2 7.4s cubic-bezier(.45,0,.16,1) both}.stage.play .o3{animation:obj3 7.4s cubic-bezier(.45,0,.16,1) both}.stage.play .ghost{animation:ghostShift 7.4s ease-in-out both}.stage.play .ripple{animation:rippleOut 7.4s ease-out both}.stage.play .word{animation:wordStory 7.4s ease-in-out both}
@keyframes lensStory{0%,10%{width:150px;height:210px;transform:translate(-50%,-50%) rotate(0deg);opacity:1}28%{width:340px;height:245px;transform:translate(-50%,-50%) rotate(0deg);opacity:1}48%{width:300px;height:230px;transform:translate(-44%,-48%) rotate(8deg);opacity:1}66%{width:330px;height:240px;transform:translate(-52%,-50%) rotate(-5deg);opacity:1}82%,100%{width:350px;height:245px;transform:translate(-50%,-50%) rotate(0);opacity:.36}}
@keyframes obj1{0%,20%{transform:translate(0,0) scale(.86);filter:blur(2px);opacity:.42}30%{transform:translate(0,0) scale(1);filter:blur(0);opacity:1}50%{transform:translate(20px,-8px) scale(1.04)}68%{transform:translate(10px,4px) scale(.98)}100%{transform:translate(8px,0) scale(1);opacity:1}}
@keyframes obj2{0%,20%{transform:scale(1);opacity:1}30%{transform:scale(1.03)}50%{transform:translate(-20px,20px) rotate(-8deg) scale(.95)}68%{transform:translate(18px,-4px) rotate(6deg) scale(1.05)}100%{transform:translate(8px,4px) rotate(0) scale(1)}}
@keyframes obj3{0%,20%{transform:translate(0,0) scale(.86);filter:blur(2px);opacity:.42}30%{transform:translate(0,0) scale(1);filter:blur(0);opacity:1}50%{transform:translate(-22px,10px) scale(.96)}68%{transform:translate(-8px,-10px) scale(1.05)}100%{transform:translate(-6px,0) scale(1);opacity:1}}
@keyframes ghostShift{0%,36%{opacity:0;transform:translate(0,0) rotate(0)}48%{opacity:.52;transform:translate(28px,-10px) rotate(10deg)}64%{opacity:.2;transform:translate(-18px,12px) rotate(-6deg)}74%,100%{opacity:0}}
@keyframes rippleOut{0%,62%{transform:translate(-50%,-50%) scale(.2);opacity:0}70%{opacity:.9}86%{transform:translate(-50%,-50%) scale(4.5,2.3);opacity:0}100%{opacity:0}}
@keyframes wordStory{0%,12%{opacity:0;transform:translateX(-50%) translateY(8px)}18%,28%{opacity:1;transform:translateX(-50%) translateY(0)}34%,42%{opacity:0}48%,60%{opacity:1}66%,72%{opacity:0}78%,94%{opacity:1}100%{opacity:.72}}
}
@media(prefers-reduced-motion:reduce){.lens{width:340px;height:245px}.o1,.o3{filter:none;opacity:1}.word{opacity:.75}}
</style>
</head>
<body>
<header class="top"><a class="brand" href="/">2rasi</a><a class="back" href="../symbols-v3/">back</a></header>
<main class="wrap"><article class="card"><div class="copy"><span class="num">06</span><h1>Strategic<br>Thinking</h1><p class="hook" data-en="Wider. Different. Again." data-lt="Plačiau. Kitaip. Dar kartą.">Wider. Different. Again.</p><div class="triplet"><span data-en="system" data-lt="sistema">system</span><span data-en="reframe" data-lt="perframinimas">reframe</span><span data-en="reflect" data-lt="refleksija">reflect</span></div><span class="tap" data-en="tap the visual to replay" data-lt="paliesk vaizdą ir pakartok">tap the visual to replay</span></div><div class="visual"><div class="stage play" id="stage"><i class="obj o1"></i><i class="obj o2"></i><i class="obj o3"></i><div class="ghost"></div><div class="lens"></div><div class="waterline"></div><div class="ripple"></div><div class="word" id="word">WIDER</div><span class="hint" data-en="one scene · three moves" data-lt="viena scena · trys judesiai">one scene · three moves</span></div></div></article></main>
<script>
(()=>{const q=new URLSearchParams(location.search),h=location.hostname.toLowerCase(),lang=q.get('lang')||((h==='2rasi.lt'||h.endsWith('.2rasi.lt'))?'lt':'en');document.documentElement.lang=lang;document.querySelectorAll('[data-en]').forEach(el=>el.textContent=lang==='lt'?el.dataset.lt:el.dataset.en);const words=lang==='lt'?['PLAČIAU','KITAIP','DAR KARTĄ']:['WIDER','DIFFERENT','AGAIN'];const stage=document.getElementById('stage'),word=document.getElementById('word');let timers=[];function play(){timers.forEach(clearTimeout);timers=[];stage.classList.remove('play');void stage.offsetWidth;stage.classList.add('play');word.textContent=words[0];timers.push(setTimeout(()=>word.textContent=words[1],3200));timers.push(setTimeout(()=>word.textContent=words[2],5050));}stage.addEventListener('click',play);play();})();
</script>
</body></html>
