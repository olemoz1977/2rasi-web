<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>2rasi · Strategic frame lab</title>
<style>
:root{--ink:#071b2e;--soft:rgba(7,27,46,.62);--glass:rgba(241,250,252,.28);--line:rgba(255,255,255,.58)}
*{box-sizing:border-box}body{margin:0;min-height:100svh;color:var(--ink);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#b9d0d8}body::before{content:"";position:fixed;inset:0;z-index:-2;background:linear-gradient(180deg,rgba(239,249,252,.1),rgba(6,42,58,.14)),url("../../assets/hero-2rasi.webp") center/cover no-repeat}body::after{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 50% 24%,rgba(255,255,255,.4),transparent 46%)}a{color:inherit;text-decoration:none}.top{display:flex;justify-content:space-between;align-items:center;padding:22px 28px}.brand{font-size:1.45rem;font-weight:780;letter-spacing:-.05em}.back{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;opacity:.5}.wrap{min-height:calc(100svh - 76px);display:grid;place-items:center;padding:18px}.card{width:min(820px,94vw);min-height:min(820px,86svh);border:1px solid var(--line);border-radius:34px;background:linear-gradient(150deg,rgba(248,253,255,.34),rgba(202,227,234,.16));backdrop-filter:blur(18px) saturate(1.05);box-shadow:0 30px 80px rgba(4,31,48,.18);overflow:hidden;display:grid;grid-template-rows:auto 1fr}.copy{padding:36px 38px 10px}.num{font-size:.66rem;letter-spacing:.2em;opacity:.42}.copy h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(3.7rem,10vw,6.6rem);font-weight:500;line-height:.9;letter-spacing:-.06em;margin:18px 0 12px}.hook{font-size:clamp(1rem,2.2vw,1.25rem);color:var(--soft);margin:0}.tap{display:block;margin-top:20px;font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;opacity:.4}.stage{position:relative;min-height:430px;overflow:hidden;touch-action:manipulation}.horizon{position:absolute;left:7%;right:7%;top:57%;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.95),rgba(53,122,145,.5),rgba(255,255,255,.95),transparent)}.world{position:absolute;inset:9% 7% 7%;transform-style:preserve-3d;perspective:900px}.panel{position:absolute;border:1px solid rgba(255,255,255,.64);background:linear-gradient(145deg,rgba(255,255,255,.18),rgba(53,116,136,.08));box-shadow:0 16px 42px rgba(3,36,53,.10);backdrop-filter:blur(3px)}.p1{left:12%;top:20%;width:23%;height:52%;transform:rotateY(8deg)}.p2{left:40%;top:12%;width:18%;height:60%;transform:rotateY(-5deg)}.p3{right:11%;top:24%;width:22%;height:47%;transform:rotateY(11deg)}.trace{position:absolute;left:8%;right:8%;bottom:13%;height:2px;background:linear-gradient(90deg,rgba(57,128,150,0),rgba(57,128,150,.55),rgba(57,128,150,.22),rgba(57,128,150,.55),rgba(57,128,150,0));transform:skewX(-12deg);opacity:.45}.frame{position:absolute;left:50%;top:49%;width:34%;height:38%;transform:translate(-50%,-50%);border:2px solid rgba(255,255,255,.88);box-shadow:0 0 0 999px rgba(199,220,227,.28),0 0 28px rgba(255,255,255,.42) inset;border-radius:8px;z-index:5;overflow:hidden}.frame::before{content:"";position:absolute;inset:0;background:linear-gradient(130deg,rgba(255,255,255,.18),rgba(255,255,255,0) 42%,rgba(255,255,255,.1));}.marker{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);z-index:8;font-family:Georgia,"Times New Roman",serif;font-size:clamp(2rem,8vw,3.6rem);letter-spacing:-.04em;opacity:.78}.m1,.m2,.m3{position:absolute;left:50%;transform:translateX(-50%);transition:opacity .4s ease}.m2,.m3{opacity:0}.stage.play .frame{animation:frameStory 6.6s cubic-bezier(.4,0,.2,1) both}.stage.play .world{animation:worldShift 6.6s cubic-bezier(.4,0,.2,1) both}.stage.play .m1{animation:label1 6.6s both}.stage.play .m2{animation:label2 6.6s both}.stage.play .m3{animation:label3 6.6s both}.stage.play .panel{animation:panelShift 6.6s cubic-bezier(.4,0,.2,1) both}
@keyframes frameStory{0%,14%{width:34%;height:38%;transform:translate(-50%,-50%) rotate(0deg)}30%,38%{width:72%;height:54%;transform:translate(-50%,-50%) rotate(0deg)}55%,64%{width:58%;height:48%;transform:translate(-38%,-53%) rotate(-7deg) skewX(-3deg)}80%,100%{width:64%;height:50%;transform:translate(-46%,-50%) rotate(1deg)}}
@keyframes worldShift{0%,38%{transform:translateX(0) scale(1)}55%,64%{transform:translateX(-5%) scale(1.04)}80%,100%{transform:translateX(2%) scale(.99)}}
@keyframes panelShift{0%,38%{filter:none}55%,64%{filter:contrast(1.15) brightness(1.05);transform:translateX(10px) rotateY(-9deg)}80%,100%{filter:none}}
@keyframes label1{0%,27%{opacity:.8}34%,100%{opacity:0}}@keyframes label2{0%,34%{opacity:0}42%,67%{opacity:.8}74%,100%{opacity:0}}@keyframes label3{0%,70%{opacity:0}80%,100%{opacity:.8}}
@media(max-width:640px){.top{padding:18px 20px}.card{min-height:86svh;border-radius:28px}.copy{padding:28px 28px 4px}.copy h1{font-size:clamp(3.3rem,16vw,5.1rem);margin:14px 0 10px}.stage{min-height:390px}.frame{width:40%;height:34%}.panel{min-width:52px}.marker{bottom:5%}}
@media(prefers-reduced-motion:reduce){.frame{width:68%;height:52%}.m1,.m2{display:none}.m3{opacity:.8}}
</style>
</head>
<body>
<header class="top"><a class="brand" href="/">2rasi</a><a class="back" href="../symbols-v4/">back</a></header>
<main class="wrap"><article class="card"><div class="copy"><span class="num">06</span><h1>Strategic<br>Thinking</h1><p class="hook" data-en="Wider. Different. Again." data-lt="Plačiau. Kitaip. Dar kartą.">Wider. Different. Again.</p><span class="tap" data-en="tap the visual to replay" data-lt="paliesk vaizdą ir pakartok">tap the visual to replay</span></div><div class="stage" id="stage"><div class="horizon"></div><div class="world"><div class="panel p1"></div><div class="panel p2"></div><div class="panel p3"></div><div class="trace"></div></div><div class="frame"></div><div class="marker"><span class="m1" data-en="WIDER" data-lt="PLAČIAU">WIDER</span><span class="m2" data-en="DIFFERENT" data-lt="KITAIP">DIFFERENT</span><span class="m3" data-en="AGAIN" data-lt="DAR KARTĄ">AGAIN</span></div></div></article></main>
<script>
const lang=(location.hostname.endsWith('.lt')?'lt':'en');document.documentElement.lang=lang;document.querySelectorAll('[data-'+lang+']').forEach(el=>el.textContent=el.dataset[lang]);const stage=document.getElementById('stage');function play(){stage.classList.remove('play');void stage.offsetWidth;stage.classList.add('play')}stage.addEventListener('click',play);if(!matchMedia('(prefers-reduced-motion: reduce)').matches) setTimeout(play,250);
</script>
</body></html>
