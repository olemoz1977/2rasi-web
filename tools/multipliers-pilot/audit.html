<!doctype html><html lang="lt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Multipliers pilot audit</title><style>body{font:15px/1.5 system-ui;margin:0;background:#f7f7f5;color:#171717}main{max-width:900px;margin:auto;padding:24px}.card{background:white;border:1px solid #e4e4df;border-radius:16px;padding:20px;margin-bottom:14px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-top:1px solid #eee}code{word-break:break-all}.muted{color:#666}</style></head><body><main><div class="card"><h1>Multipliers Pilot v0.9 · bank audit</h1><p class="muted">Rodomi tik agreguoti duomenys, kai yra bent 5 užbaigtos sesijos. Komentarai ir individualios sesijos nerodomi.</p><button id="load">Atnaujinti</button><p id="status"></p></div><div id="out"></div></main><script src="./pilot-config.js"></script><script>
const api=String(window.MULTIPLIERS_PILOT_API_BASE||"").replace(/\/$/,"");
const out=document.getElementById("out"),status=document.getElementById("status");
async function load(){if(!api){status.textContent="API dar neaktyvus.";return}status.textContent="Kraunama…";try{const r=await fetch(api+"/summary");const d=await r.json();if(!d.ok)throw new Error(d.error||r.status);if(!d.minimumReached){status.textContent="Kol kas "+d.completed+" užbaigtos sesijos. Suvestinė atsivers nuo "+d.minimum+".";out.innerHTML="";return}status.textContent="";const q=d.questionStats||[];out.innerHTML='<div class="card"><h2>Apžvalga</h2><p><strong>'+d.overview.completed+'</strong> užbaigtos sesijos · vid. AD '+d.overview.avg_ad+'</p></div><div class="card"><h2>Kryptys</h2><pre>'+JSON.stringify(d.directionTotals,null,2)+'</pre></div><div class="card"><h2>AD pagal klausimą</h2><table><thead><tr><th>Q</th><th>Ats.</th><th>AD</th><th>AD %</th><th>Vid. ms</th><th>AD ms</th></tr></thead><tbody>'+q.map(x=>'<tr><td>'+x.question_id+'</td><td>'+x.responses+'</td><td>'+x.ad_selected+'</td><td>'+x.ad_rate_pct+'</td><td>'+x.avg_ms+'</td><td>'+(x.ad_avg_ms??"—")+'</td></tr>').join("")+'</tbody></table></div><div class="card"><h2>Feedback</h2><pre>'+JSON.stringify(d.feedback,null,2)+'</pre></div>';}catch(e){status.textContent="Klaida: "+e.message}}
document.getElementById("load").onclick=load;load();
</script></body></html>
